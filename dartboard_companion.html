<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darts — Companion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #181818;
    --border: #2a2a2a;
    --primary: #008751;
    --primary-dim: #005c36;
    --primary-glow: rgba(0,135,81,0.15);
    --red: #e63946;
    --green: #2dc653;
    --white: #f0ede8;
    --muted: #666;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ─────────────────────────────────────────── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--dark);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--primary);
  }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab {
    padding: 8px 20px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-tab.active { background: var(--primary); color: var(--black); }
  .nav-tab:hover:not(.active) { color: var(--white); background: var(--border); }
  .ws-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); font-family: var(--font-mono);
  }
  .ws-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .ws-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .ws-dot.error { background: var(--red); }

  /* ── MARK BARS (Cricket & Killer) ───────────────── */
  .mark-bars { display: flex; gap: 3px; align-items: center; justify-content: center; }
  .mark-bar { width: 14px; height: 18px; border-radius: 3px; background: var(--border); transition: background 0.25s; }
  .mark-bar.lit { background: var(--primary); box-shadow: 0 0 6px var(--primary-glow); }
  .mark-bar.lit-kill { background: var(--red); box-shadow: 0 0 6px rgba(230,57,70,0.4); }

  /* ── CRICKET SCOREBOARD ──────────────────────────── */
  .cricket-board { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:13px; }
  .cricket-board th { color:var(--muted); font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border); text-align:center; }
  .cricket-board td { padding:6px 8px; border-bottom:1px solid var(--border); text-align:center; vertical-align:middle; }
  .cricket-board td.num-label { font-family:var(--font-display); font-size:22px; color:var(--white); text-align:left; padding-left:10px; }
  .cricket-board td.pts-cell { font-family:var(--font-display); font-size:18px; color:var(--primary); text-align:right; padding-right:10px; }
  .cricket-board tr.globally-closed td { opacity:0.25; filter:grayscale(1); }
  .cricket-board tr.globally-closed td.num-label { text-decoration:line-through; }
  .cricket-board tr.active-player-row td { background:rgba(0,135,81,0.06); }

  /* ── KILLER / LIMBO ──────────────────────────────── */
  .killer-badge { display:inline-block; font-family:var(--font-mono); font-size:16px; letter-spacing:2px; padding:4px 12px; border-radius:4px; background:var(--red); color:white; margin-left:8px; vertical-align:middle; }
  .limbo-bar-display { text-align:center; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:12px; }
  .limbo-bar-label { font-family:var(--font-mono); font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
  .limbo-bar-value { font-family:var(--font-display); font-size:72px; color:var(--primary); line-height:1; }
  .lives-row { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .life-pip { width:14px; height:14px; border-radius:50%; background:var(--red); transition:background 0.2s,opacity 0.2s; }
  .life-pip.lost { background:var(--border); opacity:0.3; }

  /* ── VIEWS ───────────────────────────────────────── */
  .view { display: none; }
  .view.active { display: block; flex: 1; overflow: hidden; }
  #view-companion.active { overflow-y: auto; }

  /* ── TV STAGE (16:9 preview frame) ──────────────── */
  #tv-stage {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    position: relative;
  }

  #tv-frame {
    /* Base design size: 1920×1080. Scaled + positioned by JS. */
    width: 1920px;
    height: 1080px;
    background: var(--black);
    position: absolute;
    transform-origin: top left;
    overflow: hidden;
    outline: 2px solid var(--border);
  }

  /* ── TV DISPLAY ──────────────────────────────────── */
  .tv-layout {
    display: grid;
    grid-template-columns: 1fr 420px;
    height: 1080px;
    gap: 0;
  }

  .tv-main {
    padding: 32px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow: hidden;
  }

  .tv-sidebar {
    display: flex;
    flex-direction: column;
    background: var(--dark);
    overflow: hidden;
    height: 1080px;
  }

  /* Game header */
  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .game-mode-badge {
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--primary);
    background: var(--primary-glow);
    border: 1px solid var(--primary-dim);
    padding: 6px 14px;
    border-radius: 4px;
  }
  .turn-indicator {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
  }
  .turn-indicator span { color: var(--white); }

  /* Player cards grid */
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .player-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }
  .player-card.active-player {
    border-color: var(--primary);
    box-shadow: 0 0 30px var(--primary-glow), inset 0 0 30px var(--primary-glow);
  }
  .player-card.active-player::before {
    content: 'THROWING';
    position: absolute; top: 10px; right: 10px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--primary);
    background: var(--primary-glow);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .player-card.winner {
    border-color: var(--green);
    box-shadow: 0 0 40px rgba(45,198,83,0.2);
  }

  .player-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
    border: 2px solid var(--border);
  }
  .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .player-card.active-player .player-avatar { border-color: var(--primary); }

  .player-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    width: 100%;
    text-align: center;
  }
  .player-score {
    font-family: var(--font-display);
    font-size: 72px;
    line-height: 1;
    color: var(--white);
    transition: all 0.3s;
  }
  .player-card.active-player .player-score { color: var(--primary); }
  .player-score.bust { color: var(--red) !important; animation: shake 0.4s; }
  .player-score.scored { animation: scoreFlash 0.5s; }

  .player-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Dart slots */
  .dart-slots {
    display: flex; gap: 6px; margin-top: 12px;
  }
  .dart-slot {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--border);
    transition: background 0.3s;
  }
  .dart-slot.thrown { background: var(--primary); }
  .dart-slot.bust { background: var(--red); }

  /* Sidebar dart boxes */
  .dart-box {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; min-height: 40px;
    transition: border-color 0.2s;
  }
  .dart-box-empty { opacity: 0.35; }
  .dart-box-num {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--muted); min-width: 12px;
  }
  .dart-box-value {
    font-family: var(--font-display); font-size: 20px;
    flex: 1;
  }
  .dart-box-pts {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted);
  }

  /* Dartboard SVG */
  .board-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .board-wrap {
    position: relative;
    width: 340px; height: 340px;
  }
  .board-wrap svg { width: 100%; height: 100%; }

  /* Last darts feed */
  .darts-feed {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 340px;
  }
  .darts-feed-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .dart-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--card);
    border-radius: 8px;
    border-left: 3px solid var(--border);
    animation: slideIn 0.3s ease;
  }
  .dart-entry.triple { border-left-color: var(--primary); }
  .dart-entry.double { border-left-color: #4a9eff; }
  .dart-entry.bull { border-left-color: var(--red); }
  .dart-entry.miss { border-left-color: var(--muted); opacity: 0.5; }
  .dart-entry-left { font-size: 13px; color: var(--muted); }
  .dart-entry-left strong { color: var(--white); }
  .dart-entry-score {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--white);
  }
  .dart-entry.triple .dart-entry-score { color: var(--primary); }
  .dart-entry.double .dart-entry-score { color: #4a9eff; }

  /* Sidebar */
  .sidebar-section {
    padding: 24px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* Announcement banner */
  .announcement {
    padding: 16px 24px;
    background: var(--primary-glow);
    border-bottom: 1px solid var(--primary-dim);
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: 1px;
    color: var(--primary);
    min-height: 64px;
    display: flex;
    align-items: center;
    transition: all 0.3s;
  }

  /* Game over overlay */
  .game-over-banner {
    background: linear-gradient(135deg, #0a0a0a, #1a1200);
    border: 1px solid var(--primary);
    border-radius: 16px;
    padding: 32px 40px 40px;
    text-align: center;
    margin: 32px;
  }
  .game-over-title {
    font-family: var(--font-display);
    font-size: 64px;
    color: var(--primary);
    letter-spacing: 4px;
    line-height: 1;
  }
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 12px;
    margin: 28px 0 24px;
  }
  .podium-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .podium-name {
    font-family: var(--font-display);
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  .podium-score {
    font-family: var(--font-display);
    color: var(--muted);
  }
  .podium-block {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 28px;
    color: rgba(255,255,255,0.4);
    border-radius: 8px 8px 0 0;
    width: 120px;
  }
  .podium-rest {
    margin: 8px auto 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 360px;
  }
  .podium-rest-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--card);
    border-radius: 8px;
    font-size: 14px;
  }

  /* No game state */
  .no-game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 1080px;
    gap: 16px;
    color: var(--muted);
  }
  .no-game-icon {
    font-size: 80px;
    opacity: 0.3;
  }
  .no-game h2 {
    font-family: var(--font-display);
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--border);
  }

  /* ── COMPANION APP ────────────────────────────────── */
  .companion {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Setup panel */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title {
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--primary);
  }
  .panel-body { padding: 20px; }

  /* Form elements */
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .form-input {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--white);
    font-family: var(--font-body);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .form-input:focus { border-color: var(--primary); }
  select.form-input { cursor: pointer; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 8px;
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: var(--black); }
  .btn-primary:hover { background: #ffc340; transform: translateY(-1px); }
  .btn-secondary { background: var(--border); color: var(--white); }
  .btn-secondary:hover { background: #333; }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: rgba(230,57,70,0.1); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-full { width: 100%; }

  /* Players list */
  .players-list { display: flex; flex-direction: column; gap: 8px; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--dark);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .player-row-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .player-row-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .player-row-name { flex: 1; font-size: 15px; font-weight: 500; }
  .player-row-actions { display: flex; gap: 6px; }

  /* Selected players for game */
  .selected-players {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .selected-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 8px;
    background: var(--primary-glow);
    border: 1px solid var(--primary-dim);
    border-radius: 20px;
    font-size: 13px;
    color: var(--white);
  }
  .selected-chip button {
    background: none; border: none;
    color: var(--primary); cursor: pointer;
    font-size: 16px; line-height: 1;
    padding: 0;
  }

  /* Dartboard input - interactive segments */
  .board-input-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .board-input-wrap svg {
    width: 300px; height: 300px;
    cursor: pointer;
  }
  .board-segment {
    transition: opacity 0.15s;
    cursor: pointer;
  }
  .board-segment:hover { opacity: 0.7; }
  .board-segment:active { opacity: 0.5; }

  /* Quick throw buttons */
  .quick-throw {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .throw-btn {
    padding: 10px 6px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .throw-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
  .throw-btn:active { transform: scale(0.96); }
  .throw-btn.special { border-color: var(--red); color: var(--red); }
  .throw-btn.special:hover { background: rgba(230,57,70,0.1); }

  /* Current turn display in companion */
  .current-turn-card {
    background: var(--primary-glow);
    border: 1px solid var(--primary-dim);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .current-turn-label { font-size: 12px; color: var(--primary); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .current-turn-name { font-family: var(--font-display); font-size: 28px; color: var(--white); letter-spacing: 1px; }
  .current-turn-score { font-family: var(--font-display); font-size: 48px; color: var(--primary); text-align: right; }

  /* Checkout dart boxes */
  .checkout-boxes {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .checkout-dart {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid var(--primary-dim);
    background: var(--primary-glow);
    color: var(--primary);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .checkout-dart.triple { border-color: #005c36; background: rgba(0,92,54,0.25); color: #00c968; }
  .checkout-dart.double { border-color: #1a4a8a; background: rgba(74,158,255,0.12); color: #4a9eff; }
  .checkout-dart.bull   { border-color: #8a1a1a; background: rgba(230,57,70,0.12); color: #e63946; }

  .player-combo-item:hover,
  .player-combo-item.combo-active {
    background: var(--border);
  }

  /* ── OPTION TOGGLES ─────────────────────────────── */
  .toggle-group { display:flex; gap:0; border-radius:8px; overflow:hidden; border:1px solid var(--border); width:fit-content; }
  .toggle-btn { padding:7px 16px; background:var(--dark); border:none; color:var(--muted); font-family:var(--font-body); font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; border-right:1px solid var(--border); }
  .toggle-btn:last-child { border-right:none; }
  .toggle-btn.active { background:var(--primary); color:var(--black); }
  .toggle-btn:hover:not(.active) { background:var(--border); color:var(--white); }

  /* ── PLAYER POOL (setup) ─────────────────────────── */
  .player-pool { display:flex; flex-wrap:wrap; gap:6px; min-height:36px; }
  .pool-chip { display:flex; align-items:center; gap:5px; padding:5px 10px 5px 8px; background:var(--primary-glow); border:1px solid var(--primary-dim); border-radius:20px; font-size:13px; color:var(--white); cursor:grab; user-select:none; transition:opacity 0.15s,box-shadow 0.15s; }
  .pool-chip:active { cursor:grabbing; }

  .scores-table { width: 100%; border-collapse: collapse; }
  .scores-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .scores-table td:last-child { text-align: right; font-family: var(--font-display); font-size: 20px; color: var(--primary); }
  .scores-table tr:last-child td { border-bottom: none; }
  .scores-table tr.active-row td { background: var(--primary-glow); }

  /* History */
  .history-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;

  .history-item:last-child { border-bottom: none; }
  .history-mode { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .history-winner { font-size: 14px; font-weight: 600; }
  .history-date { font-size: 12px; color: var(--muted); }

  /* Animations */
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes scoreFlash {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08); color: var(--primary); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.5; }
  }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--font-mono);
    background: var(--border);
    color: var(--muted);
  }
  .badge.green { background: rgba(45,198,83,0.15); color: var(--green); }
  .badge.amber { background: var(--primary-glow); color: var(--primary); }
  .badge.red   { background: rgba(230,57,70,0.15); color: var(--red); }

  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  .winner-banner {
    display: none;
    background: linear-gradient(90deg, #1a1200, #2a1e00, #1a1200);
    border-bottom: 2px solid #f5a623;
    padding: 14px 32px;
    text-align: center;

  .winner-banner.visible { display: block; }
  .medal-gold   { border-color: #f5a623 !important; box-shadow: 0 0 12px rgba(245,166,35,0.3); }
  .medal-silver { border-color: #c0c0c0 !important; box-shadow: 0 0 8px rgba(192,192,192,0.2); }
  .medal-bronze { border-color: #cd7f32 !important; box-shadow: 0 0 8px rgba(205,127,50,0.2); }
  tr.medal-gold   td:first-child { border-left: 3px solid #f5a623; }
  tr.medal-silver td:first-child { border-left: 3px solid #c0c0c0; }
  tr.medal-bronze td:first-child { border-left: 3px solid #cd7f32; }

  .empty-state {
    text-align: center;

    color: var(--muted);
    font-size: 14px;

  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  /* Responsive */

<script>

// ── CONFIG ────────────────────────────────────────────────────────────────────
const API = `${window.location.protocol}//${window.location.hostname}:8000`;
const WS_URL = `ws://${window.location.hostname}:8000/ws`;

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = null;
let players = [];
let modes = [];
let selectedRing = 'single';
let selectedGamePlayers = [];
let ws = null;
let dartHits = {};  // {playerId: [{x,y,segment,ring}]} for SVG overlay

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => setWS('connected');
  ws.onclose = () => { setWS('disconnected'); setTimeout(connectWS, 3000); };
  ws.onerror = () => setWS('error');
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleEvent(msg.event, msg.payload);
  };
}

function setWS(status) {
  const dot = document.getElementById('wsDot');
  const lbl = document.getElementById('wsLabel');
  dot.className = 'ws-dot ' + (status === 'connected' ? 'connected' : status === 'error' ? 'error' : '');
  lbl.textContent = status === 'connected' ? 'Live' : status === 'error' ? 'Error' : 'Reconnecting...';
}

function handleEvent(event, payload) {
  if (['game_started','dart_scored','score_overridden','dart_undone','turn_changed','state_sync'].includes(event)) {
    state = payload.state || payload;
    if (event === 'game_started') dartHits = {};
    if (event === 'dart_scored' && payload.dart) {
      addDartToFeed(payload.dart);
      addHitMarker(payload.dart.segment, payload.dart.ring, payload.dart.player_id);
    }
    if (event === 'game_over' || (payload && payload.game_over)) {
      showGameOver(payload);
    }
    renderAll();
  }
  if (event === 'announcement' && payload.text) {
    showAnnouncement(payload.text);
  }
  if (event === 'game_ended') {
    state = null;
    renderAll();
  }
}

// ── API HELPERS ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  try {
    const res = await fetch(API + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    return await res.json();
  } catch(e) {
    console.error('API error:', e);
    return null;
  }
}

// ── VIEWS ─────────────────────────────────────────────────────────────────────
function switchView(view) {
  // No-op on companion — no view switching needed
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderCompanion();
}

function renderTV() { return; // Companion only
  /* original below (unreachable) */
  const noGame = document.getElementById('tvNoGame');
  const game = document.getElementById('tvGame');

  if (!state) {
    noGame.style.display = 'flex';
    game.style.display = 'none';
    return;
  }

  // Show/hide winner banner
  const winnerBanner = document.getElementById('tvWinnerBanner');
  if (state.game_over && winnerBanner) {
    const ds = state.mode_display || {};
    const teams = ds.teams;
    let winnerLabel = 'GAME SHOT!';
    if (state.winner_id) {
      if (teams && teams.length) {
        const wt = teams.find(t => t.team_id === state.winner_id);
        if (wt) winnerLabel = '🏆 ' + wt.name + ' wins!';
      } else {
        const wp = state.players.find(p => p.id === state.winner_id);
        if (wp) winnerLabel = '🏆 ' + wp.name + ' wins!';
      }
    }
    winnerBanner.textContent = winnerLabel;
    winnerBanner.classList.add('visible');
  } else if (winnerBanner) {
    winnerBanner.classList.remove('visible');
  }

  if (state.game_over) {
    noGame.style.display = 'none';
    game.style.display = 'block';
    // Fall through to render the final game state
  } else {
    noGame.style.display = 'none';
    game.style.display = 'block';
  }

  const modeBadgeText = state.mode === 'x01' && state.options && state.options.start_score
    ? String(state.options.start_score)
    : state.mode_name || state.mode;
  document.getElementById('tvModeBadge').textContent = modeBadgeText;
  document.getElementById('tvTurnNum').textContent = state.turn_number;
  document.getElementById('tvCurrentName').textContent = state.current_player_name;

  const ds = state.mode_display || {};
  const mode = state.mode;

  // Clear mode-specific extra display upfront so stale content never lingers
  const modeExtraEarly = document.getElementById('tvModeExtra');
  if (modeExtraEarly) modeExtraEarly.innerHTML = '';

  // ── Cricket: replace players grid with marks table ──────────────────────────
  if (mode === 'cricket') {
    renderCricketTV(ds);
  } else if (mode === 'x01' && ds.teams && ds.teams.length) {
    renderX01TeamsTV(ds);
  } else {
    // Standard players grid
    const grid = document.getElementById('tvPlayersGrid');
    grid.style.display = '';
    grid.innerHTML = state.players.map(p => {
      const score = state.player_scores[p.id];
      const isActive = p.id === state.current_player_id;
      const dartsThrown = state.darts_this_turn.filter(d => d.player_id === p.id).length;
      const slots = [0,1,2].map(i =>
        `<div class="dart-slot ${i < dartsThrown ? 'thrown' : ''}"></div>`
      ).join('');
      const avatarContent = avatarHtml(p);

      let subContent = '';
      let scoreDisplay = score;

      if (mode === 'x01') {
        subContent = `<div class="player-sub">remaining</div>`;
        const co = ds.checkouts && ds.checkouts[p.id];
        subContent += `<div style="min-height:32px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:4px">${co ? checkoutBoxesHtml(co) : ''}</div>`;
      } else if (mode === 'killer') {
        const isKiller = ds.is_killer && ds.is_killer[p.id];
        const isElim = ds.eliminated && ds.eliminated[p.id];
        const num = ds.assigned_numbers && ds.assigned_numbers[p.id];
        const lives = (ds.lives && ds.lives[p.id]) || 0;
        const startLives = ds.starting_lives || 3;
        scoreDisplay = isElim
          ? `<span style="color:var(--red);font-size:52px;font-family:var(--font-display);letter-spacing:3px;line-height:1">OUT</span>`
          : `<span style="font-size:1.4em">${num || '?'}</span>${isKiller ? '<span class="killer-badge">KILLER</span>' : ''}`;
        const pips = Array.from({length:startLives},(_,i)=>`<div class="life-pip${i>=lives?' lost':''}"></div>`).join('');
        // Pre-killer: life bars act as progress toward 3
        const lifeLabel = isKiller ? 'Life' : `${lives}/${startLives}`;
        subContent = isElim ? '' : `<div class="lives-row">${pips}</div><div class="player-sub" style="font-size:13px;margin-top:4px">${lifeLabel}</div>`;
      } else if (mode === 'limbo') {
        const lives = (ds.lives && ds.lives[p.id]) || 0;
        const startLives = ds.starting_lives || 3;
        const pips = Array.from({length:startLives},(_,i)=>`<div class="life-pip${i>=lives?' lost':''}"></div>`).join('');
        subContent = `<div class="lives-row">${pips}</div>`;
      } else if (mode === 'shanghai') {
        const hits = ds.round_hits && ds.round_hits[p.id] || [];
        const hasSingle = hits.includes('single'), hasDouble = hits.includes('double'), hasTriple = hits.includes('triple');
        subContent = `<div class="player-sub" style="display:flex;gap:4px;margin-top:6px">
          <span style="color:${hasSingle?'var(--primary)':'var(--border)'}">S</span>
          <span style="color:${hasDouble?'var(--primary)':'var(--border)'}">D</span>
          <span style="color:${hasTriple?'var(--primary)':'var(--border)'}">T</span>
        </div>`;
      } else if (mode === 'beyond_top') {
        const lives = (ds.lives && ds.lives[p.id]) ?? 0;
        const startLives = ds.starting_lives || 6;
        const pts = (ds.points && ds.points[p.id]) || 0;
        const isElim = ds.eliminated && ds.eliminated[p.id];
        const pips = Array.from({length:startLives},(_,i)=>`<div class="life-pip${i>=lives?' lost':''}"></div>`).join('');
        scoreDisplay = isElim ? `<span style="color:var(--red);font-size:52px;font-family:var(--font-display);letter-spacing:3px;line-height:1">OUT</span>` : pts;
        subContent = isElim ? '' : `<div class="lives-row">${pips}</div><div class="player-sub">pts · ${lives} lives</div>`;
      } else {
        subContent = `<div class="player-sub">points</div>`;
      }

      const medalClass = state.game_over ? getMedalClass(p.id, 'player') : '';
      return `
        <div class="player-card ${isActive ? 'active-player' : ''} ${medalClass}">
          <div class="player-avatar">${avatarContent}</div>
          <div class="player-name">${p.name}</div>
          <div class="player-score" id="score-${p.id}">${scoreDisplay}</div>
          ${subContent}
          ${isActive ? `<div class="dart-slots">${slots}</div>` : ''}
        </div>`;
    }).join('');

    // Limbo: show current bar prominently
    let modeExtra = document.getElementById('tvModeExtra');
    if (!modeExtra) {
      modeExtra = document.createElement('div');
      modeExtra.id = 'tvModeExtra';
      grid.parentNode.insertBefore(modeExtra, grid);
    }
    if (mode === 'limbo' && ds.current_bar !== undefined) {
      modeExtra.innerHTML = `<div class="limbo-bar-display">
        <div class="limbo-bar-label">Current Bar</div>
        <div class="limbo-bar-value">${ds.current_bar}</div>
      </div>`;
    } else if (mode === 'shanghai' && ds.current_target) {
      modeExtra.innerHTML = `<div class="limbo-bar-display">
        <div class="limbo-bar-label">Target Number</div>
        <div class="limbo-bar-value">${ds.current_target}</div>
      </div>`;
    } else if (mode === 'beyond_top' && ds.current_target !== undefined) {
      modeExtra.innerHTML = `<div class="limbo-bar-display">
        <div class="limbo-bar-label">Round ${ds.current_round}/${ds.total_rounds} · Beat</div>
        <div class="limbo-bar-value">${ds.current_target}</div>
      </div>`;
    } else {
      modeExtra.innerHTML = '';
    }
  } // end else (standard players grid)

  const currentHits = (state && dartHits[state.current_player_id]) ? dartHits[state.current_player_id] : [];
  drawBoard('tvBoardSvg', currentHits);

  // Scores table (sidebar)
  const table = document.getElementById('tvScoresTable');
  const teamColors = ['#2862A5', '#5C2D91', '#00b4a0', '#e63946'];

  const dartBoxColor = (d) => {
    if (!d) return null;
    if (d.bust)              return '#e63946';
    if (d.ring === 'miss')   return '#555e6b';
    if (d.ring === 'triple') return '#008751';
    if (d.ring === 'double') return '#4a9eff';
    if (d.ring === 'bullseye') return '#e63946';
    if (d.ring === 'bull')   return '#f5a623';
    return '#c8cdd4';
  };

  const miniDartBoxes = (pid) => {
    const isActive = pid === state.current_player_id;
    const darts = isActive
      ? state.darts_this_turn
      : (state.last_turn_darts && state.last_turn_darts[pid]) || [];
    return `<div style="display:flex;gap:3px;margin-top:3px">` +
      [0,1,2].map(i => {
        const d = darts[i];
        if (!d) return `<div style="width:28px;height:20px;border-radius:3px;border:1px solid #333;opacity:${isActive?1:0.3}"></div>`;
        const c = dartBoxColor(d);
        const label = d.bust ? 'BUST' : formatDartLabel(d);
        return `<div style="width:28px;height:20px;border-radius:3px;border:1px solid ${c};display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:10px;color:${c}">${label}</div>`;
      }).join('') +
    `</div>`;
  };

  const medalColors = {'medal-gold':'#f5a623','medal-silver':'#c0c0c0','medal-bronze':'#cd7f32'};
  const ordinals = ['1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH'];
  const placeOrdinal = (n) => ordinals[n - 1] || (n + 'TH');
  const medalColorOf = (place) => place === 1 ? '#f5a623' : place === 2 ? '#c0c0c0' : place === 3 ? '#cd7f32' : 'var(--muted)';

  if (state.game_over) {
    // Ranked final results
    const isTeamGame = ['cricket','x01'].includes(mode) && ds.teams && ds.teams.length;
    if (isTeamGame) {
      const ranked = [...ds.teams].sort((a, b) => {
        if (a.team_id === state.winner_id) return -1;
        if (b.team_id === state.winner_id) return 1;
        // x01: lower remaining score is better; cricket: higher score is better
        if (mode === 'x01') return (a.score || 0) - (b.score || 0);
        return (b.score || 0) - (a.score || 0);
      });
      const teamScoreOf = (tid) => {
        const t = ranked.find(x => x.team_id === tid);
        return t ? (t.score || 0) : 0;
      };
      const teamRanks = computeRanks(ranked.map(t => t.team_id), teamScoreOf);
      table.innerHTML = ranked.map((t, i) => {
        const color = teamColors[ds.teams.indexOf(t) % teamColors.length];
        const place = teamRanks[i].place;
        const mc = medalColorOf(place);
        const members = state.players.filter(p => t.player_ids.includes(p.id));
        const teamRow = `<tr>
          <td colspan="2" style="padding:8px 12px 3px;border-left:3px solid ${mc};background:${mc}11">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <div style="display:flex;align-items:baseline;gap:8px">
                <span style="font-family:var(--font-display);font-size:13px;color:${mc}">${placeOrdinal(place)}</span>
                <span style="font-family:var(--font-display);font-size:18px;color:${color}">${t.name || `Team ${i+1}`}</span>
              </div>
              <span style="font-family:var(--font-display);font-size:24px;color:${color}">${t.score !== undefined ? t.score : ''}</span>
            </div>
          </td>
        </tr>`;
        const playerRows = members.map(p =>
          `<tr><td style="padding-left:20px;padding-bottom:4px;color:var(--muted);font-size:13px">${p.name}</td><td></td></tr>`
        ).join('');
        return teamRow + playerRows;
      }).join('');
    } else {
      const ranked = buildRankings();
      const pScoreOf = (pid) => {
        if (mode === 'killer') {
          const elimOrder = ds.elimination_order || [];
          if (pid === state.winner_id) return Infinity;
          const i = elimOrder.indexOf(pid);
          return i === -1 ? 1 : -i; // later elim = higher = better
        }
        if (mode === 'x01') return state.player_scores[pid] || 0;
        if (mode === 'beyond_top') return (ds.points && ds.points[pid]) || 0;
        return state.player_scores[pid] || 0;
      };
      const playerRanks = computeRanks(ranked.map(p => p.id), pScoreOf);
      table.innerHTML = ranked.map((p, i) => {
        const place = playerRanks[i].place;
        const mc = medalColorOf(place);
        return `<tr style="border-left:3px solid ${mc};background:${mc}0d">
          <td style="padding:6px 8px 6px 10px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--font-display);font-size:13px;color:${mc};min-width:28px">${placeOrdinal(place)}</span>
              <div>
                <div style="font-size:14px">${p.name}</div>
              </div>
            </div>
          </td>
          <td style="vertical-align:middle;padding-right:8px;font-family:var(--font-display);font-size:20px;color:${mc};white-space:nowrap">${formatScore(state.player_scores[p.id], mode)}</td>
        </tr>`;
      }).join('');
    }
  } else if (['cricket','x01'].includes(mode) && ds.teams && ds.teams.length) {
    table.innerHTML = ds.teams.map((t, i) => {
      const color = teamColors[i % teamColors.length];
      const isActiveTeam = t.player_ids.includes(state.current_player_id);
      const members = state.players.filter(p => t.player_ids.includes(p.id));
      const teamRow = `<tr>
        <td colspan="2" style="padding:8px 12px 3px;${isActiveTeam?`border-left:3px solid ${color};background:${color}11`:'padding-left:12px'}">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-family:var(--font-display);font-size:18px;color:${color}">${t.name || `Team ${i+1}`}</span>
            <span style="font-family:var(--font-display);font-size:24px;color:${color}">${t.score !== undefined ? t.score : ''}</span>
          </div>
        </td>
      </tr>`;
      const playerRows = members.map(p =>
        `<tr class="${p.id===state.current_player_id?'active-row':''}">
          <td style="padding-left:20px;padding-bottom:6px">
            <div style="color:var(--muted);font-size:13px">${p.name}</div>
            ${miniDartBoxes(p.id)}
          </td>
          <td></td>
        </tr>`).join('');
      return teamRow + playerRows;
    }).join('');
  } else {
    table.innerHTML = state.players.map(p => `
      <tr class="${p.id === state.current_player_id ? 'active-row' : ''}">
        <td style="padding-bottom:6px">
          <div>${p.name}</div>
          ${miniDartBoxes(p.id)}
        </td>
        <td style="vertical-align:top;padding-top:6px">${formatScore(state.player_scores[p.id], mode)}</td>
      </tr>`).join('');
  }



}

function renderCricketTV(ds) {
  const grid = document.getElementById('tvPlayersGrid');
  const numbers = ds.cricket_numbers || [20,19,18,17,16,15,25];
  const marks = ds.cricket_marks || {};
  const globally_closed = ds.globally_closed || [];
  const teams = ds.teams;
  const teamColors = ['#2862A5', '#5C2D91', '#00b4a0', '#e63946'];

  let entities;
  if (teams && teams.length) {
    entities = teams.map((t, i) => ({
      id: t.team_id,
      label: t.name || `Team ${i+1}`,
      marks: t.marks,
      score: t.score,
      color: teamColors[i % teamColors.length],
    }));
  } else {
    entities = state.players.map((p, i) => ({
      id: p.id,
      label: p.name,
      marks: marks[p.id] || {},
      score: state.player_scores[p.id] || 0,
      color: teamColors[i % teamColors.length],
    }));
  }

  const isActive = (eid) => {
    if (teams && teams.length) {
      const team = teams.find(t => t.team_id === eid);
      return team && team.player_ids.includes(state.current_player_id);
    }
    return eid === state.current_player_id;
  };

  const half = Math.ceil(entities.length / 2);
  const leftEntities = entities.slice(0, half);
  const rightEntities = entities.slice(half);

  const markBarsHtml = (m, color) => {
    const count = parseInt(m || 0);
    return [0,1,2].map(i =>
      `<div class="mark-bar${i<count?' lit':''}" style="width:48px;height:24px;border-radius:4px;${i<count?`background:${color};box-shadow:0 0 8px ${color}55`:''}"></div>`
    ).join('');
  };

  const COL_WIDTH = '180px';
  // rows: header | n0 | n1 | ... | score
  const nRows = numbers.length;
  const gridRows = `auto ${numbers.map(()=>'36px').join(' ')} auto`;

  const medalColors = { 'medal-gold': '#f5a623', 'medal-silver': '#c0c0c0', 'medal-bronze': '#cd7f32' };
  const entityType = (teams && teams.length) ? 'team' : 'player';
  const entityColHtml = (e) => {
    const active = isActive(e.id);
    const medalCls = state.game_over ? getMedalClass(e.id, entityType) : '';
    const medalColor = medalColors[medalCls];
    const border = medalColor
      ? `border:2px solid ${medalColor};background:${medalColor}18;box-shadow:0 0 16px ${medalColor}44`
      : active
        ? `border:2px solid ${e.color};background:${e.color}11`
        : `border:2px solid transparent`;
    const rows = numbers.map(n => {
      const isClosed = globally_closed.includes(n);
      const m = parseInt((e.marks && e.marks[String(n)]) || 0);
      return `<div style="display:flex;align-items:center;justify-content:center;gap:4px;opacity:${isClosed?0.2:1}">
        <div class="mark-bars">${markBarsHtml(m, e.color)}</div>
      </div>`;
    }).join('');
    return `<div style="width:${COL_WIDTH};min-width:${COL_WIDTH};max-width:${COL_WIDTH};box-sizing:border-box;display:grid;grid-row:1/-1;grid-template-rows:subgrid;border-radius:10px;padding:8px 12px;${border}">
      <div style="font-family:var(--font-display);font-size:24px;letter-spacing:1px;padding:4px 0 6px;color:${e.color};text-align:center;word-break:break-word;white-space:normal;line-height:1.1;align-self:center">${e.label}</div>
      ${rows}
      <div style="font-family:var(--font-display);font-size:28px;color:${e.color};padding-top:8px;text-align:center;align-self:center">${e.score}</div>
    </div>`;
  };

  const numberColHtml = () => {
    const rows = numbers.map(n => {
      const isClosed = globally_closed.includes(n);
      const label = n === 25 ? 'BULL' : n;
      return `<div style="display:flex;align-items:center;justify-content:center;opacity:${isClosed?0.2:1}">
        <span style="font-family:var(--font-display);font-size:${n===25?16:22}px;color:${isClosed?'var(--muted)':'var(--white)'};text-decoration:${isClosed?'line-through':'none'}">${label}</span>
      </div>`;
    }).join('');
    return `<div style="display:grid;grid-row:1/-1;grid-template-rows:subgrid;padding:8px 8px">
      <div></div>
      ${rows}
      <div></div>
    </div>`;
  };

  const leftCols = leftEntities.map(e => entityColHtml(e)).join('');
  const rightCols = rightEntities.map(e => entityColHtml(e)).join('');

  const nLeft = leftEntities.length;
  const nRight = rightEntities.length || 1;

  grid.style.display = 'block';
  grid.innerHTML = `<div style="display:grid;grid-template-columns:repeat(${nLeft},${COL_WIDTH}) auto repeat(${nRight},${COL_WIDTH});grid-template-rows:${gridRows};column-gap:8px;justify-content:center;overflow-x:auto;padding:8px">
    ${leftEntities.map(e => entityColHtml(e)).join('')}
    ${numberColHtml()}
    ${rightEntities.length ? rightEntities.map(e => entityColHtml(e)).join('') : `<div style="grid-row:1/-1;width:${COL_WIDTH}"></div>`}
  </div>`;
}

// ── BOARD SVG ─────────────────────────────────────────────────────────────────
const NUMBERS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const COLORS = { dark: '#1a1a1a', light: '#2a2a2a', red: '#c0392b', green: '#1a6b3a', wire: '#888' };

// Compute segment highlight sets for overlay
function getBoardOverlay() {
  if (!state) return { highlights: {}, label: null };
  const mode = state.mode;
  const ds = state.mode_display || {};
  const pid = state.current_player_id;
  // highlights: { segment: { single, double, triple, bull, bullseye } → color }
  const h = {};

  const mark = (seg, rings, color) => {
    if (!h[seg]) h[seg] = {};
    rings.forEach(r => h[seg][r] = color);
  };

  if (mode === 'x01') {
    // Highlight the checkout route for current player
    const co = ds.checkouts && ds.checkouts[pid];
    if (co) {
      const darts = co.trim().split(/\s+/);
      darts.forEach(d => {
        if (d === 'Bull') { mark(25, ['bull'], '#4a9eff'); }
        else if (d.startsWith('T')) { const n = parseInt(d.slice(1)); mark(n, ['triple'], '#00c968'); }
        else if (d.startsWith('D')) { const n = parseInt(d.slice(1)); mark(n, ['double'], '#4a9eff'); }
        else if (d.startsWith('S')) { const n = parseInt(d.slice(1)); mark(n, ['single'], 'var(--primary)'); }
        else { const n = parseInt(d); if (!isNaN(n)) mark(n, ['single'], 'var(--primary)'); }
      });
    }
  } else if (mode === 'cricket') {
    const nums = ds.cricket_numbers || [20,19,18,17,16,15,25];
    const playerMarks = ds.cricket_marks && ds.cricket_marks[pid];
    const globally_closed = ds.globally_closed || [];
    nums.forEach(n => {
      if (globally_closed.includes(n)) return;
      const m = playerMarks ? parseInt(playerMarks[String(n)] || 0) : 0;
      const color = m >= 3 ? '#00c968' : 'var(--primary)';
      if (n === 25) { mark(25, ['bull','bullseye'], color); }
      else { mark(n, ['single','double','triple'], color); }
    });
  } else if (mode === 'around_the_clock') {
    const target = ds.targets && ds.targets[pid];
    if (target && target <= 20) {
      mark(target, ['single','double','triple'], 'var(--primary)');
    } else if (target === 25) {
      mark(25, ['bull','bullseye'], 'var(--primary)');
    }
  } else if (mode === 'shanghai') {
    const target = ds.current_target;
    if (target) {
      mark(target, ['single'], 'var(--primary)');
      mark(target, ['double'], '#4a9eff');
      mark(target, ['triple'], '#00c968');
      // Easy mode: show adjacent segments for current player
      const isEasy = ds.easy_mode && ds.easy_mode[pid];
      if (isEasy) {
        const idx = NUMBERS.indexOf(target);
        if (idx !== -1) {
          const left = NUMBERS[(idx - 1 + 20) % 20];
          const right = NUMBERS[(idx + 1) % 20];
          // Dim amber — all rings score face value only, no ring distinction
          [left, right].forEach(adj => mark(adj, ['single','double','triple'], '#996600'));
        }
      }
    }
  } else if (mode === 'killer') {
    const myNum = ds.assigned_numbers && ds.assigned_numbers[pid];
    const isKiller = ds.is_killer && ds.is_killer[pid];
    const isElim = ds.eliminated && ds.eliminated[pid];
    const isEasy = ds.easy_mode && ds.easy_mode[pid];

    const adjOf = (n) => {
      const idx = NUMBERS.indexOf(n);
      if (idx === -1) return [];
      return [NUMBERS[(idx - 1 + 20) % 20], NUMBERS[(idx + 1) % 20]];
    };

    if (isElim) {
      // eliminated — no highlights
    } else if (!isKiller && myNum) {
      // Pre-killer: highlight own number to earn Life
      mark(myNum, ['single','double','triple'], 'var(--primary)');
      if (isEasy) adjOf(myNum).forEach(adj => mark(adj, ['single','double','triple'], '#996600'));
    } else if (isKiller) {
      // Killer: highlight live opponents
      Object.entries(ds.assigned_numbers || {}).forEach(([opid, num]) => {
        if (opid === pid) return;
        if (ds.eliminated && ds.eliminated[opid]) return;
        const lives = ds.lives && ds.lives[opid];
        if (lives >= 0) {
          mark(num, ['single','double','triple'], '#e63946');
          if (isEasy) adjOf(num).forEach(adj => mark(adj, ['single','double','triple'], '#661111'));
        }
      });
      // Own number in dim (danger — self-hit)
      if (myNum) mark(myNum, ['single','double','triple'], '#664400');
    }
  } else if (mode === 'limbo') {
    // All segments valid — show the bar as a label, no specific highlights
  }

  return { highlights: h };
}

function drawBoard(svgId, hits = []) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const cx = 200, cy = 200;
  const r = { bullseye:7, bull:19, triIn:99, triOut:107, dblIn:162, dblOut:170 };
  let html = '';

  const overlay = getBoardOverlay();
  const H = overlay.highlights;

  const overlayColor = (num, ring) => {
    if (H[num] && H[num][ring]) return H[num][ring];
    return null;
  };

  const overlayOpacity = (num) => {
    if (!state) return 1;
    // Dim segments not relevant to current mode
    if (Object.keys(H).length === 0) return 1;
    return H[num] ? 1 : 0.25;
  };

  // Background
  html += `<circle cx="${cx}" cy="${cy}" r="185" fill="#111" stroke="#333" stroke-width="2"/>`;

  // Segments
  for (let i = 0; i < 20; i++) {
    const startAngle = (i * 18 - 9) * Math.PI / 180;
    const endAngle = ((i + 1) * 18 - 9) * Math.PI / 180;
    const num = NUMBERS[i];
    const isLight = i % 2 === 0;
    const op = overlayOpacity(num);

    const drawRing = (r1, r2, baseColor, ring) => {
      const oc = overlayColor(num, ring);
      const color = oc || baseColor;
      const x1s = cx + r1 * Math.sin(startAngle), y1s = cy - r1 * Math.cos(startAngle);
      const x1e = cx + r1 * Math.sin(endAngle),   y1e = cy - r1 * Math.cos(endAngle);
      const x2s = cx + r2 * Math.sin(startAngle), y2s = cy - r2 * Math.cos(startAngle);
      const x2e = cx + r2 * Math.sin(endAngle),   y2e = cy - r2 * Math.cos(endAngle);
      html += `<path d="M${x1s},${y1s} A${r1},${r1} 0 0,1 ${x1e},${y1e} L${x2e},${y2e} A${r2},${r2} 0 0,0 ${x2s},${y2s} Z"
        fill="${color}" stroke="#0a0a0a" stroke-width="0.5" opacity="${oc ? 1 : op}"
        data-segment="${num}" data-ring="${ring}"/>`;
    };

    drawRing(r.triOut, r.dblIn, isLight ? COLORS.light : COLORS.dark, 'single');
    drawRing(r.bull, r.triIn, isLight ? COLORS.light : COLORS.dark, 'single');
    drawRing(r.triIn, r.triOut, isLight ? COLORS.red : COLORS.green, 'triple');
    drawRing(r.dblIn, r.dblOut, isLight ? COLORS.red : COLORS.green, 'double');
  }

  // Bull rings
  const bullOc = overlayColor(25, 'bull');
  const bullseyeOc = overlayColor(25, 'bullseye');
  const bullOp = overlayOpacity(25);
  html += `<circle cx="${cx}" cy="${cy}" r="${r.bull}" fill="${bullOc || COLORS.green}" stroke="#0a0a0a" stroke-width="0.5" opacity="${bullOc ? 1 : bullOp}" data-segment="25" data-ring="bull"/>`;
  html += `<circle cx="${cx}" cy="${cy}" r="${r.bullseye}" fill="${bullseyeOc || COLORS.red}" stroke="#0a0a0a" stroke-width="0.5" opacity="${bullseyeOc ? 1 : bullOp}" data-segment="25" data-ring="bullseye"/>`;

  // Wire rings
  [r.bull, r.triIn, r.triOut, r.dblIn, r.dblOut].forEach(radius => {
    html += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${COLORS.wire}" stroke-width="0.8"/>`;
  });

  // Numbers
  for (let i = 0; i < 20; i++) {
    const angle = (i * 18) * Math.PI / 180;
    const nr = 183;
    const nx = cx + nr * Math.sin(angle);
    const ny = cy - nr * Math.cos(angle);
    const num = NUMBERS[i];
    const bright = H[num] ? '#fff' : '#666';
    html += `<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="middle"
      font-family="Bebas Neue,sans-serif" font-size="13" fill="${bright}">${num}</text>`;
  }

  // Dart hit markers — most recent 3 brighter, older ones dimmer
  hits.forEach((hit, i) => {
    const age = hits.length - 1 - i; // 0 = newest
    const opacity = age === 0 ? 1 : age <= 2 ? 0.7 : 0.35;
    const outerR = age === 0 ? 6 : 5;
    html += `<circle cx="${hit.x}" cy="${hit.y}" r="${outerR}" fill="rgba(245,166,35,0.15)" stroke="#f5a623" stroke-width="1.5" opacity="${opacity}"/>`;
    html += `<circle cx="${hit.x}" cy="${hit.y}" r="2.5" fill="#f5a623" opacity="${opacity}"/>`;
  });

  svg.innerHTML = html;

  if (svgId === 'inputBoardSvg') {
    svg.querySelectorAll('[data-segment]').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const seg = parseInt(el.dataset.segment);
        const ring = el.dataset.ring;
        if (ring === 'bull' || ring === 'bullseye') throwDart(seg, ring);
        else throwDart(seg, selectedRing);
      });
    });
  }
}

function checkoutBoxesHtml(hint) {
  if (!hint) return '';
  const darts = hint.trim().split(/\s+/);
  const boxes = darts.map(d => {
    let cls = '';
    if (d.startsWith('T')) cls = 'triple';
    else if (d.startsWith('D')) cls = 'double';
    else if (d === 'Bull' || d === 'Bull25') cls = 'bull';
    return `<span class="checkout-dart ${cls}">${d}</span>`;
  }).join('');
  return `<div class="checkout-boxes">${boxes}</div>`;
}

async function throwDart(segment, ring) {
  if (!state || state.game_over) return;
  const result = await api('POST', '/game/dart', { segment, ring });
  if (result && !result.detail) {
    // Add hit marker to board
    // Play announcement
    if (result.announcement) showAnnouncement(result.announcement);
    state = result;
    if (result.dart) addDartToFeed(result.dart);
    renderAll();
    if (result.game_over) showGameOver(result);
  }
}

async function undoDart() {
  const result = await api('POST', '/game/undo');
  if (result && !result.detail) {
    if (result && result.current_player_id && dartHits[result.current_player_id]) dartHits[result.current_player_id].pop();
    state = result;
    renderAll();
  }
}

async function nextTurn() {
  const result = await api('POST', '/game/next-turn');
  if (result && !result.detail) { state = result; renderAll(); }
}

async function endGame() {
  if (!confirm('End the current game?')) return;
  await api('POST', '/game/end');
  state = null;
  dartHits = {};
  renderAll();
}

async function overrideScore() {
  const playerId = document.getElementById('overridePlayer').value;
  const score = parseInt(document.getElementById('overrideScore').value);
  if (!playerId || isNaN(score)) return;
  const result = await api('POST', '/game/override', {
    player_id: playerId, new_score: score, reason: 'Manual override'
  });
  if (result && !result.detail) {
    state = result;
    renderAll();
    document.getElementById('overrideScore').value = '';
    showAnnouncement('Score overridden!');
  }
}

function playerComboKey(e) {
  const list = document.getElementById('playerComboList');
  if (!list || list.style.display === 'none') return;
  const items = list.querySelectorAll('.player-combo-item');
  let active = list.querySelector('.player-combo-item.combo-active');
  let idx = Array.from(items).indexOf(active);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    idx = Math.min(idx + 1, items.length - 1);
    items.forEach(el => el.classList.remove('combo-active'));
    if (items[idx]) items[idx].classList.add('combo-active');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    idx = Math.max(idx - 1, 0);
    items.forEach(el => el.classList.remove('combo-active'));
    if (items[idx]) items[idx].classList.add('combo-active');
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (active) { addPlayerToGame(active.dataset.id); closePlayerCombo(); }
    else if (items[0]) { addPlayerToGame(items[0].dataset.id); closePlayerCombo(); }
  } else if (e.key === 'Escape') {
    closePlayerCombo();
  }
}

async function loadModes() {
  const raw = await api('GET', '/modes') || [];
  const order = ['x01', 'cricket', 'killer', 'shanghai', 'limbo', 'around_the_clock'];
  modes = [...raw].sort((a, b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    if (ai === -1 && bi === -1) return a.name.localeCompare(b.name);
    if (ai === -1) return 1; if (bi === -1) return -1;
    return ai - bi;
  });
  const sel = document.getElementById('setupMode');
  sel.innerHTML = modes.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  sel.addEventListener('change', () => { renderModeOptions(); renderTeamsSection(); });
  renderModeOptions();
  renderTeamsSection();
}

// Toggle button state — keyed by option id
const _toggleState = {};

function setToggle(key, val) {
  _toggleState[key] = val;
  document.querySelectorAll(`[data-toggle="${key}"]`).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.value === String(val));
  });
  const dep = document.getElementById(`toggle-dep-${key}`);
  if (dep) dep.style.display = val ? 'block' : 'none';
  if (key === 'teams_enabled') renderTeamsSection();
  if (key === 'easy_mode') renderEasyZones();
}

function renderEasyZones() {
  const container = document.getElementById('easyModeZones');

  if (!_toggleState['easy_mode']) { container.innerHTML = ''; return; }

  // Init if needed
  if (easyAssignments.normal.length + easyAssignments.easy.length !== selectedGamePlayers.length) {
    easyAssignments = { normal: [...selectedGamePlayers], easy: [] };

      </div>

  container.innerHTML = zoneHtml('normal','Normal','var(--primary)') + zoneHtml('easy','Easy mode','#4a9eff');

function onDropEasy(event, zone) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if (!_dragPid) return;
  easyAssignments.normal = easyAssignments.normal.filter(id => id !== _dragPid);
  easyAssignments.easy = easyAssignments.easy.filter(id => id !== _dragPid);
  easyAssignments[zone].push(_dragPid);
  _dragPid = null;
  renderEasyZones();
}


function renderModeOptions() {
  const modeId = document.getElementById('setupMode').value;
  const mode = modes.find(m => m.id === modeId);
  const container = document.getElementById('setupModeOptions');
  if (!mode || !mode.options_schema || !Object.keys(mode.options_schema).length) {
    container.innerHTML = ''; return;
  }

  const isCricket = modeId === 'cricket';
  const hasTeams = isCricket || modeId === 'x01';
  const hasEasyMode = ['shanghai','killer'].includes(modeId);

  const schemaEntries = Object.entries(mode.options_schema)
    .filter(([key]) => {
      if (hasTeams && (key === 'teams' || key === 'team_names')) return false;
      if (hasEasyMode && (key === 'easy_players')) return false;
      if (key === 'double_out') return false; // rendered inline with double_in
      return true;
    });

  const toggleHtml = (key, schema) => {
    const def = schema.default === true || schema.default === 'true';
    _toggleState[key] = def;
    return '<div class="toggle-group">'
      + '<button class="toggle-btn ' + (!def?'active':'') + '" data-toggle="' + key + '" data-value="false" onclick="setToggle(\'' + key + '\',false)">No</button>'
      + '<button class="toggle-btn ' + (def?'active':'') + '" data-toggle="' + key + '" data-value="true" onclick="setToggle(\'' + key + '\',true)">Yes</button>'
      + '</div>';
  };

  container.innerHTML = schemaEntries
    .map(([key, schema]) => {
      const label = key.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
      const desc = schema.description ? '<div style="color:var(--muted);font-size:11px;margin-top:2px">' + schema.description + '</div>' : '';

      if (schema.type === 'boolean') {
        _toggleState[key] = schema.default === true || schema.default === 'true';

        // double_in: render double_in and double_out side by side
        if (key === 'double_in' && mode.options_schema['double_out'] !== undefined) {
          const outSchema = mode.options_schema['double_out'];
          _toggleState['double_out'] = outSchema.default === true || outSchema.default === 'true';
          return '<div class="form-row">'
            + '<div class="form-label">Double In / Double Out</div>'
            + '<div style="display:flex;gap:16px;align-items:center">'
            + '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">'
            + '<span style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase">In</span>'
            + toggleHtml('double_in', schema)
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">'
            + '<span style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase">Out</span>'
            + toggleHtml('double_out', outSchema)
            + '</div>'
            + '</div>'
            + '</div>';
        }

        // easy_mode gets a dependent section
        const depSection = (hasEasyMode && key === 'easy_mode')
          ? '<div id="toggle-dep-easy_mode" style="display:' + (_toggleState[key]?'block':'none') + ';margin-top:10px" class="form-row">'
            + '<div class="form-label">Easy players<div style="color:var(--muted);font-size:11px;margin-top:2px">Drag players to Normal or Easy</div></div>'
            + '<div id="easyModeZones"></div>'
            + '</div>'
          : '';
        return '<div class="form-row">'
          + '<div class="form-label">' + label + desc + '</div>'
          + toggleHtml(key, schema)
          + '</div>' + depSection;

      } else if (schema.options) {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <select class="form-input" id="opt_${key}">
            ${schema.options.map(o => `<option value="${o}" ${o===schema.default?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>`;
      } else if (schema.type === 'string') {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <input type="text" class="form-input" id="opt_${key}" value="${schema.default||''}" placeholder="${schema.description||''}">
        </div>`;
      } else {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <input type="number" class="form-input" id="opt_${key}" value="${schema.default||0}" min="${schema.min||0}" max="${schema.max||999}">
        </div>`;
      }
    }).join('');

  if (hasEasyMode) renderEasyZones();
}
