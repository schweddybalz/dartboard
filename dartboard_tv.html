async function uploadAvatar(playerId, input) {
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  await fetch(`${API}/players/${playerId}/avatar`, { method: 'POST', body: form });
  await loadPlayers();
}

// ── GAME SETUP ────────────────────────────────────────────────────────────────
async function loadModes() {
  const raw = await api('GET', '/modes') || [];
  const order = ['x01', 'cricket', 'killer', 'shanghai', 'limbo', 'around_the_clock'];
  modes = [...raw].sort((a, b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    if (ai === -1 && bi === -1) return a.name.localeCompare(b.name);
    if (ai === -1) return 1; if (bi === -1) return -1;
    return ai - bi;
  });
  const sel = document.getElementById('setupMode');
  sel.innerHTML = modes.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  sel.addEventListener('change', () => { renderModeOptions(); renderTeamsSection(); });
  renderModeOptions();
  renderTeamsSection();
}

// Toggle button state — keyed by option id
const _toggleState = {};

function setToggle(key, val) {
  _toggleState[key] = val;
  document.querySelectorAll(`[data-toggle="${key}"]`).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.value === String(val));
  });
  const dep = document.getElementById(`toggle-dep-${key}`);
  if (dep) dep.style.display = val ? 'block' : 'none';
  if (key === 'teams_enabled') renderTeamsSection();
  if (key === 'easy_mode') renderEasyZones();
}

// ── EASY MODE ZONES ───────────────────────────────────────────────────────────
// easyAssignments: { normal: [pid,...], easy: [pid,...] }
let easyAssignments = { normal: [], easy: [] };

function renderEasyZones() {
  const container = document.getElementById('easyModeZones');
  if (!container) return;
  if (!_toggleState['easy_mode']) { container.innerHTML = ''; return; }

  // Init if needed
  if (easyAssignments.normal.length + easyAssignments.easy.length !== selectedGamePlayers.length) {
    easyAssignments = { normal: [...selectedGamePlayers], easy: [] };
  }

  const makeChip = (pid) => {
    const p = players.find(pl => pl.id === pid);
    if (!p) return '';
    return `<div class="pool-chip" draggable="true" ondragstart="onDragStart(event,'${pid}')" id="chip-easy-${pid}">${chipAvatarHtml(p)} ${p.name}</div>`;
  };

  const zoneHtml = (key, label, color) => `
    <div style="margin-bottom:8px">
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:${color};text-transform:uppercase;margin-bottom:6px">${label}</div>
      <div class="team-zone" style="border-color:${color}22"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="onDropEasy(event,'${key}')">
        <div class="team-zone-players">${easyAssignments[key].map(makeChip).join('') || `<span style="color:var(--muted);font-size:12px">Drop players here</span>`}</div>
      </div>
    </div>`;

  container.innerHTML = zoneHtml('normal','Normal','var(--primary)') + zoneHtml('easy','Easy mode','#4a9eff');
}

function onDropEasy(event, zone) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if (!_dragPid) return;
  easyAssignments.normal = easyAssignments.normal.filter(id => id !== _dragPid);
  easyAssignments.easy = easyAssignments.easy.filter(id => id !== _dragPid);
  easyAssignments[zone].push(_dragPid);
  _dragPid = null;
  renderEasyZones();
}


function renderModeOptions() {
  const modeId = document.getElementById('setupMode').value;
  const mode = modes.find(m => m.id === modeId);
  const container = document.getElementById('setupModeOptions');
  if (!mode || !mode.options_schema || !Object.keys(mode.options_schema).length) {
    container.innerHTML = ''; return;
  }

  const isCricket = modeId === 'cricket';
  const hasTeams = isCricket || modeId === 'x01';
  const hasEasyMode = ['shanghai','killer'].includes(modeId);

  const schemaEntries = Object.entries(mode.options_schema)
    .filter(([key]) => {
      if (hasTeams && (key === 'teams' || key === 'team_names')) return false;
      if (hasEasyMode && (key === 'easy_players')) return false;
      if (key === 'double_out') return false; // rendered inline with double_in
      return true;
    });

  const toggleHtml = (key, schema) => {
    const isAtc = modeId === 'around_the_clock';
    const atcForceTrue = isAtc && (key.includes('double') || key.includes('triple') || key.includes('skip'));
    const def = atcForceTrue || schema.default === true || schema.default === 'true';
    _toggleState[key] = def;
    return '<div class="toggle-group">'
      + '<button class="toggle-btn ' + (!def?'active':'') + '" data-toggle="' + key + '" data-value="false" onclick="setToggle(\'' + key + '\',!_toggleState[\'' + key + '\'])">No</button>'
      + '<button class="toggle-btn ' + (def?'active':'') + '" data-toggle="' + key + '" data-value="true" onclick="setToggle(\'' + key + '\',!_toggleState[\'' + key + '\'])">Yes</button>'
      + '</div>';
  };

  container.innerHTML = schemaEntries
    .map(([key, schema]) => {
      const label = key.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
      const desc = schema.description ? '<div style="color:var(--muted);font-size:11px;margin-top:2px">' + schema.description + '</div>' : '';

      if (schema.type === 'boolean') {
        _toggleState[key] = schema.default === true || schema.default === 'true';

        // double_in: render double_in and double_out side by side
        if (key === 'double_in' && mode.options_schema['double_out'] !== undefined) {
          const outSchema = mode.options_schema['double_out'];
          _toggleState['double_out'] = outSchema.default === true || outSchema.default === 'true';
          return '<div class="form-row">'
            + '<div class="form-label">Double In / Double Out</div>'
            + '<div style="display:flex;gap:16px;align-items:center">'
            + '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">'
            + '<span style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase">In</span>'
            + toggleHtml('double_in', schema)
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">'
            + '<span style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase">Out</span>'
            + toggleHtml('double_out', outSchema)
            + '</div>'
            + '</div>'
            + '</div>';
        }

        // easy_mode gets a dependent section
        const depSection = (hasEasyMode && key === 'easy_mode')
          ? '<div id="toggle-dep-easy_mode" style="display:' + (_toggleState[key]?'block':'none') + ';margin-top:10px" class="form-row">'
            + '<div class="form-label">Easy players<div style="color:var(--muted);font-size:11px;margin-top:2px">Drag players to Normal or Easy</div></div>'
            + '<div id="easyModeZones"></div>'
            + '</div>'
          : '';
        return '<div class="form-row">'
          + '<div class="form-label">' + label + desc + '</div>'
          + toggleHtml(key, schema)
          + '</div>' + depSection;

      } else if (schema.options) {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <select class="form-input" id="opt_${key}">
            ${schema.options.map(o => `<option value="${o}" ${o===schema.default?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>`;
      } else if (schema.type === 'string') {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <input type="text" class="form-input" id="opt_${key}" value="${schema.default||''}" placeholder="${schema.description||''}">
        </div>`;
      } else {
        return `<div class="form-row">
          <div class="form-label">${label}${desc}</div>
          <input type="number" class="form-input" id="opt_${key}" value="${schema.default||0}" min="${schema.min||0}" max="${schema.max||999}">
        </div>`;
      }
    }).join('');

  if (hasEasyMode) renderEasyZones();
}

function renderSelectedPlayers() { renderPlayerPool(); }

// ── TEAMS ──────────────────────────────────────────────────────────────────────
// teamAssignments[teamIndex] = [pid, pid, ...]
let teamAssignments = [];
let teamNames = [];

function renderTeamsSection() {
  const modeId = document.getElementById('setupMode')?.value;
  const hasTeamsMode = modeId === 'cricket' || modeId === 'x01';
  const section = document.getElementById('teamsSection');
  if (!section) return;

  if (!hasTeamsMode) { section.style.display = 'none'; return; }

  // Show teams toggle as part of cricket options
  section.style.display = 'block';

  // Check if teams toggle exists; if not, insert it
  if (!document.getElementById('teamsToggleRow')) {
    const row = document.createElement('div');
    row.id = 'teamsToggleRow';
    row.className = 'form-row';
    row.innerHTML = `<div class="form-label">Teams</div>
      <div class="toggle-group">
        <button class="toggle-btn active" data-toggle="teams_enabled" data-value="false" onclick="setToggle('teams_enabled',!_toggleState['teams_enabled'])">Off</button>
        <button class="toggle-btn" data-toggle="teams_enabled" data-value="true" onclick="setToggle('teams_enabled',!_toggleState['teams_enabled'])">On</button>
      </div>`;
    section.insertBefore(row, section.querySelector('div[style]') || section.firstChild);

function renderTeams() {
  const active = _toggleState['teams_enabled'];
  const grid = document.getElementById('teamsGrid');
  const header = document.querySelector('#teamsSection > div[style]');
  if (header) header.style.display = active ? 'flex' : 'none';
  if (!grid) return;
  if (!active) { grid.innerHTML = ''; return; }

  const n = parseInt(document.getElementById('numTeams')?.value || 2);
  if (teamAssignments.length !== n) {
    teamAssignments = Array.from({length: n}, () => []);
    teamNames = Array.from({length: n}, (_, i) => `Team ${i+1}`);
    selectedGamePlayers.forEach((pid, i) => teamAssignments[i % n].push(pid));
  }
  while (teamNames.length < n) teamNames.push(`Team ${teamNames.length+1}`);

  const colors = ['#2862A5','#5C2D91','#00b4a0','#e63946','#f5a623','#2dc653','#e87b1e','#c975d4','#00b8d9','#ff6b9d','#7cb518','#ff9a3c'];
  grid.innerHTML = `<div class="teams-grid" style="grid-template-columns: repeat(${Math.min(n,2)}, 1fr)">` +
    teamAssignments.map((team, i) => {
      const chips = team.map(pid => {
        const p = players.find(pl => pl.id === pid);
        if (!p) return '';
        return `<div class="pool-chip" draggable="true" style="border-color:${colors[i]};color:${colors[i]};background:${colors[i]}22"
          ondragstart="onDragStart(event,'${pid}')" id="chip-team-${pid}">
          ${chipAvatarHtml(p)} ${p.name}
        </div>`;
      }).join('');
      return `<div class="team-zone"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="onDropTeam(event,${i})">
        <input type="text" value="${teamNames[i]}"
          style="font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:${colors[i]};background:transparent;border:none;outline:none;width:100%;text-transform:uppercase;margin-bottom:8px;padding:2px 4px;border-radius:3px;cursor:text"
          placeholder="Team ${i+1}" oninput="teamNames[${i}]=this.value"
          onfocus="this.style.background='rgba(255,255,255,0.06)'"
          onblur="this.style.background='transparent'">
        <div class="team-zone-players">${chips || '<span style="color:var(--muted);font-size:12px">Drop players here</span>'}</div>
      </div>`;
    }).join('') + `</div>`;
}

function randomizeTeams() {
  const n = parseInt(document.getElementById('numTeams')?.value || 2);
  const shuffled = [...selectedGamePlayers].sort(() => Math.random() - 0.5);
  teamAssignments = Array.from({length: n}, () => []);
  shuffled.forEach((pid, i) => teamAssignments[i % n].push(pid));
  renderTeams();
}

// ── DRAG AND DROP ─────────────────────────────────────────────────────────────
let _dragPid = null;

function onDragStart(event, pid) {
  _dragPid = pid;
  setTimeout(() => { const el = document.getElementById('chip-' + pid); if (el) el.classList.add('dragging'); }, 0);
}

function onDropTeam(event, teamIdx) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if (!_dragPid) return;
  // Remove from all teams first
  teamAssignments = teamAssignments.map(team => team.filter(id => id !== _dragPid));
  // Add to target team
  if (!teamAssignments[teamIdx].includes(_dragPid)) teamAssignments[teamIdx].push(_dragPid);
  _dragPid = null;
  renderTeams();
}

function addPlayerToGame(playerId) {
  if (!playerId || selectedGamePlayers.includes(playerId)) return;
  selectedGamePlayers.push(playerId);
  if (_toggleState['teams_enabled'] && teamAssignments.length) {
    const smallest = teamAssignments.reduce((a, t, i) => t.length < teamAssignments[a].length ? i : a, 0);
    teamAssignments[smallest].push(playerId);
    renderTeams();
  }
  easyAssignments.normal.push(playerId);
  renderEasyZones();
  renderPlayerPool();
  const spi = document.getElementById('setupPlayerInput'); if (spi) { spi.value=''; closePlayerCombo(); }
}

function removePlayerFromGame(playerId) {
  selectedGamePlayers = selectedGamePlayers.filter(id => id !== playerId);
  teamAssignments = teamAssignments.map(t => t.filter(id => id !== playerId));
  easyAssignments.normal = easyAssignments.normal.filter(id => id !== playerId);
  easyAssignments.easy = easyAssignments.easy.filter(id => id !== playerId);
  renderPlayerPool();
  renderTeams();
  renderEasyZones();
}

async function startGame() {
  try { return await _startGame(); } catch(e) { console.error('startGame error:', e); alert('Error: ' + e.message); }
}
async function _startGame() {
  const mode = document.getElementById('setupMode').value;
  if (!mode) return alert('Select a game mode');
  if (!selectedGamePlayers.length) return alert('Add at least one player');

  const modeConfig = modes.find(m => m.id === mode);
  const options = {};
  if (modeConfig && modeConfig.options_schema) {
    Object.entries(modeConfig.options_schema).forEach(([key, schema]) => {
      if (mode === 'cricket' && key === 'teams') return; // handled below
      if (schema.type === 'boolean') {
        options[key] = _toggleState[key] !== undefined ? _toggleState[key] : schema.default;
      } else {
        const el = document.getElementById('opt_' + key);
        if (!el) return;
        if (schema.type === 'integer') options[key] = parseInt(el.value);
        else options[key] = el.value;
      }
    });
  }

  // Build teams string for cricket
  if (['cricket','x01'].includes(mode) && _toggleState['teams_enabled'] && teamAssignments.length >= 2) {
    const nonEmpty = teamAssignments.map((t, i) => ({ team: t, idx: i })).filter(({team}) => team.length > 0);
    if (nonEmpty.length >= 2) {
      options.teams = nonEmpty.map(({team}) =>
        team.map(pid => selectedGamePlayers.indexOf(pid) + 1).filter(i => i > 0).join(',')
      ).join('|');
      options.team_names = nonEmpty.map(({idx}) => teamNames[idx] || `Team ${idx+1}`).join('|');
    }
  }

  // Build easy_players string for shanghai/killer
  if (['shanghai','killer'].includes(mode) && _toggleState['easy_mode'] && easyAssignments.easy.length) {
    options.easy_players = easyAssignments.easy
      .map(pid => selectedGamePlayers.indexOf(pid) + 1)
      .filter(i => i > 0)
      .join(',');
  }

  const result = await api('POST', '/game/new', { mode, player_ids: selectedGamePlayers, options });

  if (result && !result.detail) {
    state = result;
    dartHits = {};
    // Keep selectedGamePlayers so the same group doesn't need re-adding next game
    teamAssignments = [];
    teamNames = [];
    easyAssignments = { normal: [...selectedGamePlayers], easy: [] };
    renderAll();
    switchView('tv');
    // Reset teams toggle after switching view so any DOM errors don't block the game starting
    _toggleState['teams_enabled'] = false;
    document.querySelectorAll('[data-toggle="teams_enabled"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.value === 'false');
    });
  } else {
    alert(result?.detail || 'Failed to start game');
  }
}

// ── DART FEED ─────────────────────────────────────────────────────────────────
// ── TURN PANEL ────────────────────────────────────────────────────────────────
function renderTurnPanel() {
  const panel = document.getElementById('tvTurnPanel');
  if (!panel) return;

  if (!state || state.game_over) {
    if (state && state.game_over) {
      // Show winner in the now-throwing panel
      const ds = state.mode_display || {};
      const teams = ds.teams;
      const wid = state.winner_id;
      let winnerName = null;
      let winnerColor = 'var(--primary)';
      if (wid && teams && teams.length) {
        const byTeamId = teams.find(t => t.team_id === wid);
        if (byTeamId) { winnerName = byTeamId.name; }
        else {
          const byPlayer = teams.find(t => t.player_ids && t.player_ids.includes(wid));
          if (byPlayer) winnerName = byPlayer.name;
        }
      }
      if (!winnerName && wid && state.players) {
        const wp = state.players.find(p => p.id === wid);
        if (wp) { winnerName = wp.name; winnerColor = playerColorOf(wid); }
      }
      if (winnerName && teams && teams.length) {
        const teamColors = ['#2862A5','#5C2D91','#00b4a0','#e63946','#f5a623','#2dc653','#e87b1e','#c975d4','#00b8d9','#ff6b9d','#7cb518','#ff9a3c'];
        const idx = teams.findIndex(t => t.name === winnerName || t.player_ids?.includes(wid));
        if (idx >= 0) winnerColor = teamColors[idx % teamColors.length];
      }
      panel.innerHTML = winnerName ? `
        <div class="turn-now" style="border-color:#f5a623;border-width:2px;background:rgba(26,18,0,0.95);box-shadow:0 0 40px rgba(245,166,35,0.6),0 0 80px rgba(245,166,35,0.25),inset 0 0 30px rgba(245,166,35,0.08);text-align:center;animation:pulse 1.4s ease-in-out infinite;transform-origin:center">
          <div style="font-family:var(--font-mono);font-size:40px;letter-spacing:4px;color:#f5a623;opacity:0.8;text-transform:uppercase;margin-bottom:6px">🏆 Winner</div>
          <div style="font-family:var(--font-display);font-size:120px;color:#f5a623;line-height:1;text-shadow:0 0 20px rgba(245,166,35,0.8)">${winnerName}</div>
        </div>` : '';
    } else {
      panel.innerHTML = '';
    }
    return;
  }

  const players = state.players;
  const cur = players.find(p => p.id === state.current_player_id);
  if (!cur) return;

  const ds = state.mode_display || {};
  const teams = ds.teams;

  const color = playerColorOf(cur.id);
  const colorGlow = color.startsWith('#') ? color + '22' : 'rgba(0,135,81,0.1)';

  // Dart slots for current player
  const dartsThrown = (state.darts_this_turn || []).filter(d => d.player_id === cur.id).length;
  const slots = [0,1,2].map(i =>
    `<div style="width:36px;height:5px;border-radius:3px;background:${i < dartsThrown ? color : 'var(--border)'}"></div>`
  ).join('');

  // Use backend upcoming_players — already in correct turn order
  let upcomingIds = (state.upcoming_players || []);
  if (!upcomingIds.length) {
    const curIdx = players.findIndex(p => p.id === cur.id);
    for (let i = 1; i <= Math.min(4, players.length - 1); i++) {
      upcomingIds.push(players[(curIdx + i) % players.length].id);
    }
  }

  // For team games: reconstruct correct per-team next-member using turn history
  if (teams && teams.length) {
    // Find which team the current player is on
    const curTeamIdx = teams.findIndex(t => t.player_ids.includes(cur.id));

    // Use turn_order_history to find who threw last for each team
    const turnHistory = state.turn_order_history || [];

    const lastThrowerOfTeam = (teamIdx) => {
      const team = teams[teamIdx];
      if (teamIdx === curTeamIdx) return cur.id;
      // Walk history backwards to find last player from this team
      for (let i = turnHistory.length - 1; i >= 0; i--) {
        if (team.player_ids.includes(turnHistory[i])) return turnHistory[i];
      }
      return null;
    };

    const nextMemberOfTeam = (teamIdx) => {
      const team = teams[teamIdx];
      if (team.player_ids.length === 1) return team.player_ids[0];
      const last = lastThrowerOfTeam(teamIdx);
      if (!last) return team.player_ids[0];
      const lastIdx = team.player_ids.indexOf(last);
      return team.player_ids[(lastIdx + 1) % team.player_ids.length];
    };

    // Build queue: next 3 teams in round-robin order, each showing their next member
    upcomingIds = [];
    for (let i = 1; i <= Math.min(3, teams.length); i++) {
      const nextTeamIdx = (curTeamIdx + i) % teams.length;
      upcomingIds.push(nextMemberOfTeam(nextTeamIdx));
    }
  }

  // Deduplicate, exclude current, and exclude eliminated
  const seen = new Set([cur.id]);
  const uniqueNext = upcomingIds
    .filter(pid => {
      if (seen.has(pid)) return false;
      seen.add(pid);
      if (ds.eliminated && ds.eliminated[pid]) return false;
      return true;
    })
    .slice(0, 3)
    .map(pid => players.find(p => p.id === pid))
    .filter(Boolean);

  const nextLabel = ['NEXT', '2ND', '3RD'];
  const nextHtml = uniqueNext.map((p, i) => `
    <div class="turn-next-item">
      <span class="turn-next-pos">${nextLabel[i]}</span>
      <span class="turn-next-name" style="color:${playerColorOf(p.id)}">${p.name}</span>
    </div>`).join('');

  panel.innerHTML = `
    <div class="turn-panel-label">Now throwing</div>
    <div class="turn-now" style="border-color:${color};background:${colorGlow}">
      <div class="turn-now-name" style="color:${color}">${cur.name}</div>
      <div class="turn-now-darts">${slots}</div>
    </div>
    ${uniqueNext.length ? `
      <div class="turn-next">
        <div class="turn-next-label">Up next</div>
        ${nextHtml}
      </div>` : ''}`;
}

let feedItems = [];

function addDartToFeed(dart) {
  feedItems.unshift(dart);
  if (feedItems.length > 5) feedItems = feedItems.slice(0, 5);

  const feed = document.getElementById('tvDartsFeed');
  if (!feed) return;

  const dartColor = (d) => {
    if (d.bust)              return '#e63946';
    if (d.ring === 'miss')   return '#555e6b';
    if (d.ring === 'triple') return '#008751';
    if (d.ring === 'double') return '#4a9eff';
    if (d.ring === 'bullseye') return '#e63946';
    if (d.ring === 'bull')   return '#f5a623';
    return '#c8cdd4';
  };

  feed.innerHTML = feedItems.map(d => {
    const c = dartColor(d);
    const pc = playerColorOf(d.player_id);
    const label = d.bust ? 'BUST' : formatDartLabel(d);
    const scored = d.bust ? '' : d.scored;
    const labelBox = `<div style="min-width:52px;height:28px;border-radius:4px;border:1px solid ${c};display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:17px;color:${c};padding:0 6px">${label}</div>`;
    return `<div style="display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-radius:8px;border-left:3px solid ${c};animation:slideIn 0.3s ease">
      <span style="font-family:var(--font-display);font-size:30px;color:${pc};text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.player_name}</span>
      ${labelBox}
      <span style="font-family:var(--font-display);font-size:32px;color:${c};min-width:36px;text-align:right">${scored}</span>
    </div>`;
  }).join('');
}

function addHitMarker(segment, ring, playerId) {
  if (ring === 'miss') return;
  const cx = 200, cy = 200;
  const rings = { bullseye:7, bull:19, triIn:99, triOut:107, dblIn:162, dblOut:170 };
  let x, y;
  if (ring === 'bullseye') {
    const a = Math.random() * 2 * Math.PI;
    const rr = Math.random() * rings.bullseye;
    x = cx + rr * Math.cos(a); y = cy + rr * Math.sin(a);
  } else if (ring === 'bull') {
    const a = Math.random() * 2 * Math.PI;
    const rr = rings.bullseye + Math.random() * (rings.bull - rings.bullseye);
    x = cx + rr * Math.cos(a); y = cy + rr * Math.sin(a);
  } else {
    // Scatter within the segment arc and ring band
    const segIdx = NUMBERS.indexOf(parseInt(segment));
    const midAngle = segIdx >= 0 ? (segIdx * 18) * Math.PI / 180 : 0;
    const arcSpread = (8 * Math.PI / 180); // ~8 degrees each side
    const angle = midAngle + (Math.random() - 0.5) * 2 * arcSpread;
    let rInner, rOuter;
    if (ring === 'triple')      { rInner = rings.triIn;  rOuter = rings.triOut; }
    else if (ring === 'double') { rInner = rings.dblIn;  rOuter = rings.dblOut; }
    else {
      // Single: scatter across the full single zone (inner + outer single)
      rInner = rings.bull;
      rOuter = rings.triIn;
    }
    const radius = rInner + Math.random() * (rOuter - rInner);
    x = cx + radius * Math.sin(angle);
    y = cy - radius * Math.cos(angle);
  }
  if (!dartHits[playerId]) dartHits[playerId] = [];
  dartHits[playerId].push({ x, y, segment, ring });
}

// ── GAME OVER ─────────────────────────────────────────────────────────────────
// Returns array of {id, place} where ties share same place and next place skips
// sortedIds: array of ids already sorted best→worst
// scoreOf(id): returns comparable score value (used to detect ties)
function computeRanks(sortedIds, scoreOf) {
  const result = [];
  for (let i = 0; i < sortedIds.length; i++) {
    if (i > 0 && scoreOf(sortedIds[i]) === scoreOf(sortedIds[i - 1])) {
      result.push({ id: sortedIds[i], place: result[i - 1].place });
    } else {
      result.push({ id: sortedIds[i], place: i + 1 });
    }
  }
  return result;
}

function buildRankings() {
  if (!state || !state.players) return [];
  const scores = state.player_scores || {};
  const mode = state.mode;
  const ds = state.mode_display || {};
  const elimOrder = (ds.elimination_order) || [];
  const hasElimOrder = elimOrder.length > 0 || (ds.eliminated && Object.values(ds.eliminated).some(v => v));

  return [...state.players].sort((a, b) => {
    const aElim = ds.eliminated && ds.eliminated[a.id];
    const bElim = ds.eliminated && ds.eliminated[b.id];

    // For modes with elimination ordering: winner first, then by reverse elim order
    if (hasElimOrder) {
      if (a.id === state.winner_id) return -1;
      if (b.id === state.winner_id) return 1;
      const ai = elimOrder.indexOf(a.id);
      const bi = elimOrder.indexOf(b.id);
      // Still alive non-winners rank above eliminated players
      if (ai === -1 && bi !== -1) return -1;
      if (ai !== -1 && bi === -1) return 1;
      if (ai === -1 && bi === -1) return 0;
      return bi - ai; // later elimination = better rank
    }

    if (aElim && !bElim) return 1;
    if (!aElim && bElim) return -1;
    if (a.id === state.winner_id) return -1;
    if (b.id === state.winner_id) return 1;
    if (mode === 'x01') return (scores[a.id] || 0) - (scores[b.id] || 0);
    if (mode === 'beyond_top') {
      const ap = (ds.points && ds.points[a.id]) || 0;
      const bp = (ds.points && ds.points[b.id]) || 0;
      return bp - ap;
    }
    return (scores[b.id] || 0) - (scores[a.id] || 0);
  });
}

function renderPodium() {
  const el = document.getElementById('tvPodium');
  if (!el || !state) return;
  const ranked = buildRankings();
  const scores = state.player_scores || {};
  const mode = state.mode;
  const ds = state.mode_display || {};
  const podiumColors = ['#f5a623', '#c0c0c0', '#cd7f32'];
  const podiumHeights = [120, 90, 70];

  const scoreLabel = (p) => {
    if (mode === 'beyond_top') return ((ds.points && ds.points[p.id]) || 0) + ' pts';
    if (mode === 'killer') return (ds.lives && ds.lives[p.id] || 0) + ' lives';
    return scores[p.id] !== undefined ? scores[p.id] : '—';
  };

  const slotHtml = (p, rank) => {
    if (!p) return '<div class="podium-slot" style="width:120px"><div class="podium-block" style="height:' + podiumHeights[rank] + 'px;background:#1a1a1a;border:1px solid #222;width:120px"></div></div>';
    const color = podiumColors[rank] || 'var(--muted)';
    const height = podiumHeights[rank] || 50;
    const size = rank === 0 ? 72 : 52;
    const fontSize = rank === 0 ? 36 : 26;
    const nameSize = rank === 0 ? 22 : 16;
    const av = p.avatar_url
      ? '<img src="' + API + p.avatar_url + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover;border:3px solid ' + color + '">'
      : '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + getAvatarColor(p.name) + ';display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:' + fontSize + 'px;color:#fff;border:3px solid ' + color + '">' + getInitial(p.name) + '</div>';
    return '<div class="podium-slot">'
      + av
      + '<div class="podium-name" style="font-size:' + nameSize + 'px;color:' + color + '">' + p.name + '</div>'
      + '<div class="podium-score" style="font-size:' + (rank === 0 ? 18 : 14) + 'px">' + scoreLabel(p) + '</div>'
      + '<div class="podium-block" style="height:' + height + 'px;background:' + color + '22;border:1px solid ' + color + '44">' + (rank + 1) + '</div>'
      + '</div>';
  };

  const pScoreOf2 = (pid) => {
    if (mode === 'beyond_top') return (ds.points && ds.points[pid]) || 0;
    if (mode === 'killer') return (ds.lives && ds.lives[pid]) || 0;
    if (mode === 'x01') return -(scores[pid] || 0); // negate: lower is better
    return scores[pid] || 0;
  };
  const pRanks = computeRanks(ranked.map(p => p.id), pScoreOf2);
  const placeOf = (p) => p ? (pRanks.find(r => r.id === p.id) || {}).place || 99 : 99;
  const pcOf = (place) => place === 1 ? '#f5a623' : place === 2 ? '#c0c0c0' : place === 3 ? '#cd7f32' : 'var(--muted)';

  const podiumOrder = [ranked[1], ranked[0], ranked[2]];
  let html = '<div class="podium">'
    + slotHtml(podiumOrder[0], Math.min(placeOf(podiumOrder[0]) - 1, 1))
    + slotHtml(podiumOrder[1], placeOf(podiumOrder[1]) - 1)
    + slotHtml(podiumOrder[2], Math.min(placeOf(podiumOrder[2]) - 1, 2))
    + '</div>';

  if (ranked.length > 3) {
    html += '<div class="podium-rest">';
    for (let i = 3; i < ranked.length; i++) {
      const p = ranked[i];
      const place = placeOf(p);
      const mc = pcOf(place);
      const av = p.avatar_url
        ? '<img src="' + API + p.avatar_url + '" style="width:24px;height:24px;border-radius:50%;object-fit:cover">'
        : '<div style="width:24px;height:24px;border-radius:50%;background:' + getAvatarColor(p.name) + ';display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;color:#fff">' + getInitial(p.name) + '</div>';
      html += '<div class="podium-rest-row">'
        + '<span style="font-family:var(--font-display);font-size:16px;color:' + mc + ';width:32px">' + (ordinals[place-1]||place+'TH') + '</span>'
        + av
        + '<span style="flex:1;text-align:left">' + p.name + '</span>'
        + '<span style="font-family:var(--font-display);color:' + mc + '">' + scoreLabel(p) + '</span>'
        + '</div>';
    }
    html += '</div>';
  }

  el.innerHTML = html;
}

function getMedalClass(id, type) {
  if (!state || !state.game_over) return '';
  const ds = state.mode_display || {};
  const scores = state.player_scores || {};
  const mode = state.mode;
  const teams = ds.teams;

  // Build ranked list of the relevant entity type
  const elimOrder = (ds.elimination_order) || [];
  const hasElimOrder = elimOrder.length > 0 || (ds.eliminated && Object.values(ds.eliminated).some(v => v));
  let entities;
  if (type === 'team' && teams && teams.length) {
    entities = [...teams].map(t => t.team_id);
    entities.sort((a, b) => {
      if (a === state.winner_id) return -1;
      if (b === state.winner_id) return 1;
      if (mode === 'x01') return (scores[a] || 0) - (scores[b] || 0);
      return (scores[b] || 0) - (scores[a] || 0);
    });
  } else {
    entities = [...state.players].map(p => p.id);
    entities.sort((a, b) => {
      if (hasElimOrder) {
        if (a === state.winner_id) return -1;
        if (b === state.winner_id) return 1;
        const ai = elimOrder.indexOf(a);
        const bi = elimOrder.indexOf(b);
        if (ai === -1 && bi !== -1) return -1; // alive beats eliminated
        if (ai !== -1 && bi === -1) return 1;
        if (ai === -1 && bi === -1) return 0;
        return bi - ai; // later eliminated = better rank
      }
      const aElim = ds.eliminated && ds.eliminated[a];
      const bElim = ds.eliminated && ds.eliminated[b];
      if (aElim && !bElim) return 1;
      if (!aElim && bElim) return -1;
      if (a === state.winner_id) return -1;
      if (b === state.winner_id) return 1;
      if (mode === 'x01') return (scores[a] || 0) - (scores[b] || 0);
      if (mode === 'beyond_top') return ((ds.points && ds.points[b]) || 0) - ((ds.points && ds.points[a]) || 0);
      return (scores[b] || 0) - (scores[a] || 0);
    });
  }

  // Score function for tie detection
  const scoreOf = (eid) => {
    if (type === 'team' && teams && teams.length) {
      const t = teams.find(t => t.team_id === eid);
      return t ? (t.score || 0) : 0;
    }
    // Any mode with elimination ordering
    if (hasElimOrder) {
      if (eid === state.winner_id) return Infinity;
      const i = elimOrder.indexOf(eid);
      if (i === -1) return 1; // still alive non-winner
      return -i; // earlier elimination = lower = worse rank
    }
    if (mode === 'x01') return scores[eid] || 0;
    if (mode === 'beyond_top') return (ds.points && ds.points[eid]) || 0;
    return scores[eid] || 0;
  };
  const ranks = computeRanks(entities, scoreOf);
  const place = (ranks.find(r => r.id === id) || {}).place;
  if (place === 1) return 'medal-gold';
  if (place === 2) return 'medal-silver';
  if (place === 3) return 'medal-bronze';
  return '';
}

function resolveWinner(payload) {
  const ds = state && state.mode_display || {};
  const teams = ds.teams;
  const wid = payload.winner_id || (state && state.winner_id);
  let winnerName = null, winnerPlayer = null;
  if (wid && teams && teams.length) {
    const byTeamId = teams.find(t => t.team_id === wid);
    if (byTeamId) { winnerName = byTeamId.name; }
    else {
      const byPlayer = teams.find(t => t.player_ids && t.player_ids.includes(wid));
      if (byPlayer) winnerName = byPlayer.name;
    }
  }
  if (!winnerName && wid && state && state.players) {
    winnerPlayer = state.players.find(p => p.id === wid);
    if (winnerPlayer) winnerName = winnerPlayer.name;
  }
  return { wid, winnerName, winnerPlayer };
}

function showGameOver(payload) {
  const { winnerName } = resolveWinner(payload);
  showAnnouncement(winnerName ? winnerName + ' wins!' : 'Game over!', 99999);
  renderCompanion();
}

function showWinnerSplash(payload, onDone) {
  const { wid, winnerName, winnerPlayer } = resolveWinner(payload);
  const el = document.getElementById('turnAnnounce');
  if (!el || !winnerName) { renderAll(); if (onDone) onDone(); return; }

  if (turnAnnounceTimer) { clearTimeout(turnAnnounceTimer); turnAnnounceTimer = null; }

  const gold = '#f5a623';
  const player = winnerPlayer || (wid && state && state.players && state.players.find(p => p.id === wid));
  const avatarInner = player && player.avatar_url
    ? `<img src="${API}${player.avatar_url}" alt="${player.name}">`
    : player
      ? `<span style="font-family:var(--font-display);font-size:90px;color:#fff;background:${getAvatarColor(player.name)};width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%"><span style="transform:translateY(8%);display:block">${getInitial(player.name)}</span></span>`
      : `<span style="font-family:var(--font-display);font-size:80px;color:${gold}">🏆</span>`;

  el.innerHTML = `
    <div class="ta-color-bar" style="background:${gold}"></div>
    <div class="ta-body" style="background:linear-gradient(105deg, rgba(10,10,10,0.97) 60%, rgba(245,166,35,0.1) 100%);flex:1">
      <div class="ta-avatar" style="border-color:${gold};box-shadow:0 0 40px rgba(245,166,35,0.5)">
        ${avatarInner}
      </div>
      <div class="ta-text">
        <div class="ta-label" style="color:${gold};letter-spacing:8px">🏆 Winner</div>
        <div class="ta-name" style="color:${gold}">${winnerName}</div>
      </div>
    </div>`;

  el.className = '';
  void el.offsetWidth;
  el.className = 'in';

  showAnnouncement(winnerName + ' wins!', 99999);

  const HOLD = 4500;
  turnAnnounceTimer = setTimeout(() => {
    el.className = 'out';
    el.addEventListener('animationend', () => {
      if (el.className === 'out') {
        el.className = '';
        renderAll();
        if (onDone) onDone();
      }
    }, { once: true });
  }, HOLD);
}

function showEliminationSplash(player, onDone) {
  if (!player) { if (onDone) onDone(); return; }
  const el = document.getElementById('turnAnnounce');
  if (!el) { if (onDone) onDone(); return; }

  playSadTrombone();

  if (turnAnnounceTimer) { clearTimeout(turnAnnounceTimer); turnAnnounceTimer = null; }

  const red = '#e63946';
  const pc = playerColorOf(player.id);
  const avatarInner = player.avatar_url
    ? `<img src="${API}${player.avatar_url}" alt="${player.name}">`
    : `<span style="font-family:var(--font-display);font-size:90px;color:#fff;background:${getAvatarColor(player.name)};width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%"><span style="transform:translateY(8%);display:block">${getInitial(player.name)}</span></span>`;

  el.innerHTML = `
    <div class="ta-color-bar" style="background:${red}"></div>
    <div class="ta-body" style="background:linear-gradient(105deg, rgba(10,10,10,0.97) 60%, rgba(230,57,70,0.08) 100%);flex:1">
      <div class="ta-avatar" style="border-color:${pc};opacity:0.7">
        ${avatarInner}
      </div>
      <div class="ta-text">
        <div class="ta-label" style="color:${red};letter-spacing:8px">Eliminated</div>
        <div style="position:relative;display:inline-block">
          <div class="ta-name" style="color:${pc}">${player.name}</div>
          <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="-2" y1="5" x2="102" y2="95" stroke="#e63946" stroke-width="11" stroke-linecap="round"
              style="stroke-dasharray:145;stroke-dashoffset:145;animation:drawX1 0.3s ease-in forwards;animation-delay:0.5s"/>
            <line x1="102" y1="5" x2="-2" y2="95" stroke="#e63946" stroke-width="11" stroke-linecap="round"
              style="stroke-dasharray:145;stroke-dashoffset:145;animation:drawX1 0.3s ease-in forwards;animation-delay:0.85s"/>
          </svg>
        </div>
      </div>
    </div>`;

  el.className = '';
  void el.offsetWidth;
  el.className = 'in';

  const HOLD = 3000;
  turnAnnounceTimer = setTimeout(() => {
    el.className = 'out';
    el.addEventListener('animationend', () => {
      if (el.className === 'out') {
        el.className = '';
        if (onDone) onDone();
      }
    }, { once: true });
  }, HOLD);
}

function showTurnAnnounce() {
  if (!state || state.game_over) return;
  const players = state.players || [];
  const cur = players.find(p => p.id === state.current_player_id);
  if (!cur) return;

  const el = document.getElementById('turnAnnounce');
  if (!el) return;

  const color = playerColorOf(cur.id);
  const colorFaint = color.startsWith('#') ? color + '18' : 'rgba(0,135,81,0.09)';

  // Avatar HTML (large)
  const avatarInner = cur.avatar_url
    ? `<img src="${API}${cur.avatar_url}" alt="${cur.name}">`
    : `<span style="font-family:var(--font-display);font-size:90px;color:#fff;background:${getAvatarColor(cur.name)};width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%"><span style="transform:translateY(8%);display:block">${getInitial(cur.name)}</span></span>`;

  // Up-next rows
  const ds = state.mode_display || {};
  let upcomingIds = (state.upcoming_players || []).filter(id => id !== cur.id && !(ds.eliminated && ds.eliminated[id])).slice(0, 3);
  if (!upcomingIds.length) {
    const idx = players.findIndex(p => p.id === cur.id);
    for (let i = 1; i <= Math.min(players.length - 1, players.length); i++) {
      const pid = players[(idx + i) % players.length].id;
      if (pid !== cur.id && !(ds.eliminated && ds.eliminated[pid])) upcomingIds.push(pid);
      if (upcomingIds.length >= 3) break;
    }
  }
  const nextPlayers = upcomingIds.map(id => players.find(p => p.id === id)).filter(Boolean).slice(0, 3);

  const nextRowsHtml = nextPlayers.map(p => {
    const pc = playerColorOf(p.id);
    const sm = p.avatar_url
      ? `<img src="${API}${p.avatar_url}">`
      : `<span style="font-family:var(--font-display);font-size:20px;color:#fff;background:${getAvatarColor(p.name)};width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%"><span style="transform:translateY(8%);display:block">${getInitial(p.name)}</span></span>`;
    return `<div class="ta-next-row">
      <div class="ta-next-avatar" style="border:2px solid ${pc}">${sm}</div>
      <span class="ta-next-name" style="color:${pc}">${p.name}</span>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="ta-color-bar" style="background:${color}"></div>
    <div class="ta-body" style="background:linear-gradient(105deg, rgba(10,10,10,0.97) 60%, ${colorFaint} 100%)">
      <div class="ta-avatar" style="border-color:${color}">
        ${avatarInner}
      </div>
      <div class="ta-text">
        <div class="ta-label">Now throwing</div>
        <div class="ta-name" style="color:${color}">${cur.name}</div>
      </div>
    </div>
    ${nextPlayers.length ? `
    <div class="ta-right">
      <div class="ta-up-next-label">Up next</div>
      ${nextRowsHtml}
    </div>` : ''}`;

  // Clear any existing timer
  if (turnAnnounceTimer) clearTimeout(turnAnnounceTimer);
  el.className = '';
  void el.offsetWidth; // reflow to restart animation
  el.className = 'in';

  turnAnnounceTimer = setTimeout(() => {
    el.className = 'out';
    el.addEventListener('animationend', () => {
      if (el.className === 'out') el.className = '';
    }, { once: true });
  }, 2600);
}

// ── ANNOUNCEMENTS ─────────────────────────────────────────────────────────────
let announcementTimer = null;
function showAnnouncement(text, duration) {
  const el = document.getElementById('tvAnnouncement');
  if (!el) return;
  el.textContent = text;
  el.style.color = 'var(--primary)';
  if (announcementTimer) clearTimeout(announcementTimer);
  announcementTimer = setTimeout(() => {
    el.style.color = 'var(--muted)';
    el.textContent = 'Ready.';
  }, duration || 4000);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function formatScore(score, mode) {
  if (score === null || score === undefined) return '—';
  return score;
}

function formatDartLabel(dart) {
  if (dart.ring === 'miss') return 'MISS';
  if (dart.ring === 'bullseye') return 'DBull';
  if (dart.ring === 'bull') return 'Bull';
  const prefix = dart.ring === 'triple' ? 'T' : dart.ring === 'double' ? 'D' : '';
  return `${prefix}${dart.segment}`;
}

function getInitial(name) {
  return (name || '?')[0].toUpperCase();
}

// Deterministic colour from name for avatar backgrounds
function getAvatarColor(name) {
  const colors = [
    '#1a6b3a','#1a3a6b','#6b1a1a','#4a1a6b','#1a4a6b',
    '#6b4a1a','#1a6b4a','#6b1a4a','#3a6b1a','#1a1a6b',
    '#5c3a1a','#1a5c3a','#3a1a5c','#5c1a3a','#1a3a5c',
    '#3a5c1a','#5c1a1a','#1a5c5c','#3a1a3a','#1a3a1a'
  ];
  // Positional hash (djb2-style) so names with same letters in different order differ
  let h = 5381;
  for (const c of (name || '').toLowerCase()) h = ((h * 31) ^ c.charCodeAt(0)) >>> 0;
  return colors[h % colors.length];
}

// For use inside .player-avatar divs
function avatarHtml(player) {
  if (player.avatar_url) return `<img src="${API}${player.avatar_url}" alt="${player.name}">`;
  const color = getAvatarColor(player.name);
  return `<span style="font-family:var(--font-display);font-size:38px;color:#fff;line-height:1;background:${color};width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%"><span style="transform:translateY(8%);display:block">${getInitial(player.name)}</span></span>`;
}

// For use in small inline chips (player pool, selected players)
function chipAvatarHtml(player) {
  if (player.avatar_url) return `<img src="${API}${player.avatar_url}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;">`;
  const color = getAvatarColor(player.name);
  return `<span style="font-family:var(--font-display);font-size:15px;color:#fff;background:${color};width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0"><span style="transform:translateY(8%);display:block">${getInitial(player.name)}</span></span>`;
}

// ── TV FRAME SCALER ───────────────────────────────────────────────────────────
function scaleTvFrame() {
  const frame = document.getElementById('tv-frame');
  if (!frame) return;
  const sw = window.innerWidth;
  const sh = window.innerHeight;
  const scale = Math.min(sw / 1920, sh / 1080);
  const scaledW = 1920 * scale;
  const scaledH = 1080 * scale;
  frame.style.transform = `scale(${scale})`;
  frame.style.left = ((sw - scaledW) / 2) + 'px';
  frame.style.top  = ((sh - scaledH) / 2) + 'px';
}
window.addEventListener('resize', scaleTvFrame);

async function init() {
  connectWS();
  drawBoard('tvBoardSvg');
  scaleTvFrame();
  const current = await api('GET', '/game/state');
  if (current && !current.detail && !current.game_over) {
    state = current;
    renderTV();
  }
}
init();
</script>
