// ── Killer TV Overlay ─────────────────────────────────────────────────────────
function renderKillerTV(ds, gameState) {
  const grid = document.getElementById('tvPlayersGrid');
  if (grid) grid.style.display = 'none';
  const boardContainer = document.querySelector('.board-container');
  if (boardContainer) boardContainer.style.display = 'none';
  const sidebar = document.querySelector('.tv-sidebar');
  if (sidebar) sidebar.style.display = 'none';
  const tvLayout = document.querySelector('.tv-layout');

  let overlay = document.getElementById('killerOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'killerOverlay';
    document.getElementById('tvGame').appendChild(overlay);
  }

  const players     = gameState.players || [];
  const phase       = ds.phase || 'game';
  const assignedNums = ds.assigned_numbers || {};
  const lives       = ds.lives || {};
  const isKiller    = ds.is_killer || {};
  const eliminated  = ds.eliminated || {};
  const startLives  = ds.starting_lives || 3;
  const currentPid  = gameState.current_player_id;

  // ── Game over layout ──────────────────────────────────────────────────────
  if (gameState.game_over) {
    if (tvLayout) tvLayout.style.visibility = 'visible';
    const tvMain = document.querySelector('.tv-main');
    if (tvMain) tvMain.style.borderRight = 'none';
    const tvSidebarEl = document.querySelector('.tv-sidebar');
    if (tvSidebarEl) tvSidebarEl.style.visibility = 'hidden';

    const winnerId = gameState.winner_id;
    const winner = players.find(p => p.id === winnerId);
    const winnerColor = winner ? playerColorOf(winnerId) : 'var(--primary)';

    // Build standings: winner first, then reverse elimination order
    const elimOrder = ds.elimination_order || [];
    // Standings: winner (1st), then eliminated in reverse order (last eliminated = 2nd)
    // All players not in elimOrder were still alive — add them after winner
    const elimReversed = [...elimOrder].reverse().filter(id => id !== winnerId);
    const remaining = players.map(p => p.id).filter(id => id !== winnerId && !elimOrder.includes(id));
    const standings = [winnerId, ...remaining, ...elimReversed];

    const standingRows = standings.map((pid, i) => {
      const p = players.find(pl => pl.id === pid);
      if (!p) return '';
      const color = playerColorOf(pid);
      const place = i + 1;
      const medals = {1:'🏆',2:'🥈',3:'🥉'};
      const medal = medals[place] || `${place}.`;
      const avatarEl = p.avatar_url
        ? `<img src="${p.avatar_url}" style="width:56px;height:56px;border-radius:50%;border:3px solid ${color};object-fit:cover;flex-shrink:0">`
        : `<div style="width:56px;height:56px;border-radius:50%;border:3px solid ${color};background:${color}22;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:${color};flex-shrink:0">${(p.name||'?')[0].toUpperCase()}</div>`;
      return `<div style="display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:14px;border:2px solid ${place===1?color:'rgba(255,255,255,0.06)'};background:${place===1?color+'18':'rgba(0,0,0,0.3)'};box-sizing:border-box;width:100%">
        <div style="font-size:32px;width:44px;text-align:center;flex-shrink:0">${medal}</div>
        ${avatarEl}
        <div style="font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:${color}">${p.name}</div>
      </div>`;
    }).join('');

    const GOLD = '#f5c518';
    const GOLD2 = '#ffd700';

    const winnerAvatar = winner?.avatar_url
      ? `<img src="${winner.avatar_url}" style="width:300px;height:300px;border-radius:50%;border:8px solid ${GOLD};object-fit:cover;box-shadow:0 0 80px ${GOLD}88,0 0 160px ${GOLD}44">`
      : `<div style="width:300px;height:300px;border-radius:50%;border:8px solid ${GOLD};background:${winnerColor}22;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:${winnerColor};box-shadow:0 0 80px ${GOLD}88,0 0 160px ${GOLD}44">${(winner?.name||'?')[0].toUpperCase()}</div>`;

    overlay.innerHTML = `
      <div style="display:flex;flex:1;min-height:0">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px">
          <div style="font-family:var(--font-mono);font-size:22px;letter-spacing:8px;color:${GOLD};opacity:0.8;text-transform:uppercase">🏆 WINNER 🏆</div>
          ${winnerAvatar}
          <div style="font-family:var(--font-display);font-size:130px;font-weight:900;letter-spacing:4px;color:${winnerColor};text-shadow:0 0 60px ${winnerColor}88;text-transform:uppercase;line-height:1">${winner?.name || 'WINNER'}</div>
          <div style="
            font-family:var(--font-display);font-size:36px;font-weight:900;letter-spacing:6px;text-transform:uppercase;
            background:linear-gradient(90deg,#b8860b,${GOLD2},#fffacd,${GOLD2},#b8860b);
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            animation:goldShine 2.5s linear infinite;
          ">KILLER CHAMPION</div>
        </div>
        <div style="width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;padding:40px 20px;background:rgba(0,0,0,0.3);border-left:1px solid rgba(255,255,255,0.06);justify-content:center;align-items:stretch;box-sizing:border-box">
          <div style="font-family:var(--font-mono);font-size:14px;letter-spacing:4px;color:var(--muted);text-align:center;margin-bottom:8px">STANDINGS</div>
          ${standingRows}
        </div>
      </div>`;
    return;
  }
  const assignQueue = ds.assignment_queue || [];

  // Board geometry — proper dartboard proportions, viewBox 0 0 110 110
  const BOARD_ORDER_TV = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  const CX = 55, CY = 55;
  const R_BULL    =  1.8;  // bullseye — actual scale
  const R_BULL25  =  4.0;  // outer bull
  const R_INNER_S = 22;    // inner single outer edge
  const R_TRIPLE_I= 24;    // triple ring inner
  const R_TRIPLE_O= 28;    // triple ring outer
  const R_OUTER_S = 42;    // outer single outer edge
  const R_DOUBLE_I= 44;    // double ring inner
  const R_DOUBLE_O= 48;    // double ring outer
  const R_LABEL   = 53;    // number label radius

  // Build color map: pid → color
  const colorMap = {};
  players.forEach(p => { colorMap[p.id] = playerColorOf(p.id); });

  // Build segment → pid map
  const segToPid = {};
  Object.entries(assignedNums).forEach(([pid, num]) => { segToPid[num] = pid; });

  function segAngle(num) {
    const idx = BOARD_ORDER_TV.indexOf(num);
    const startDeg = idx * 18 - 9 - 90; // -90 so 20 is at top
    return { start: startDeg * Math.PI / 180, end: (startDeg + 18) * Math.PI / 180, mid: (startDeg + 9) * Math.PI / 180 };
  }

  function arc(r1, r2, startA, endA) {
    const x1 = CX + r1 * Math.cos(startA), y1 = CY + r1 * Math.sin(startA);
    const x2 = CX + r2 * Math.cos(startA), y2 = CY + r2 * Math.sin(startA);
    const x3 = CX + r2 * Math.cos(endA),   y3 = CY + r2 * Math.sin(endA);
    const x4 = CX + r1 * Math.cos(endA),   y4 = CY + r1 * Math.sin(endA);
    return `M${x1},${y1} L${x2},${y2} A${r2},${r2} 0 0,1 ${x3},${y3} L${x4},${y4} A${r1},${r1} 0 0,0 ${x1},${y1}Z`;
  }

  // Draw segments
  let segPaths = '';

  // Wire frame background
  segPaths += `<circle cx="${CX}" cy="${CY}" r="${R_DOUBLE_O+1}" fill="#111"/>`;

  BOARD_ORDER_TV.forEach((num, idx) => {
    const { start, end } = segAngle(num);
    const isEven = idx % 2 === 0;
    const pid = segToPid[num];
    const color = pid ? colorMap[pid] : null;
    const isElim = pid ? eliminated[pid] : false;
    const dimAlpha = isElim ? '30' : '88';
    const fullAlpha = isElim ? '40' : 'ff';

    // Greyscale for unowned segments
    const greyDark   = isEven ? '#2a2a2a' : '#1a1a1a';
    const greyBright = isEven ? '#555' : '#3a3a3a';

    // Outer single
    segPaths += `<path d="${arc(R_TRIPLE_O, R_DOUBLE_I, start, end)}" fill="${color ? color+dimAlpha : greyDark}" stroke="#000" stroke-width="0.4"/>`;
    // Inner single
    segPaths += `<path d="${arc(R_BULL25, R_TRIPLE_I, start, end)}" fill="${color ? color+dimAlpha : greyDark}" stroke="#000" stroke-width="0.4"/>`;
    // Triple ring
    segPaths += `<path d="${arc(R_TRIPLE_I, R_TRIPLE_O, start, end)}" fill="${color ? color+fullAlpha : greyBright}" stroke="#000" stroke-width="0.4"/>`;
    // Double ring
    segPaths += `<path d="${arc(R_DOUBLE_I, R_DOUBLE_O, start, end)}" fill="${color ? color+fullAlpha : greyBright}" stroke="#000" stroke-width="0.4"/>`;

    // Number label — between double ring and avatar
    const lA = segAngle(num).mid;
    const lx = CX + R_LABEL * Math.cos(lA);
    const ly = CY + R_LABEL * Math.sin(lA);
    const numColor = color && !isElim ? color : '#666';
    segPaths += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="4.5" font-weight="800" fill="${numColor}" font-family="monospace">${num}</text>`;
  });

  // Bull rings (drawn on top)
  segPaths += `<circle cx="${CX}" cy="${CY}" r="${R_BULL25}" fill="#555" stroke="#000" stroke-width="0.4"/>`;
  segPaths += `<circle cx="${CX}" cy="${CY}" r="${R_BULL}"   fill="#333" stroke="#000" stroke-width="0.4"/>`;

  // Avatar pins embedded directly in SVG at R_PIN — perfectly aligned radially
  const R_PIN = 68;
  const AV_R  = 6.5;
  const isGamePhase = phase === 'game';
  let avatarSvg = '';

  // SVG animation definition for active player pulse
  avatarSvg += `<defs>
    <animate id="killerPulse" attributeName="r" values="${AV_R+1.5};${AV_R+3.5};${AV_R+1.5}" dur="1.4s" repeatCount="indefinite"/>
    <animate id="killerPulseO" attributeName="opacity" values="0.9;0.3;0.9" dur="1.4s" repeatCount="indefinite"/>
  </defs>`;

  players.forEach(p => {
    const num = assignedNums[p.id];
    if (!num) return;
    const { mid } = segAngle(num);
    const ax = CX + R_PIN * Math.cos(mid);
    const ay = CY + R_PIN * Math.sin(mid);
    const color = colorMap[p.id];
    const opacity = eliminated[p.id] ? 0.3 : 1;
    const isActive = isGamePhase && p.id === currentPid;
    const clipId  = `kc${p.id.replace(/-/g,'')}`;

    // Outer pulsing glow ring for active player — expands out and fades, doesn't snap back
    if (isActive) {
      avatarSvg += `<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${AV_R}" fill="none" stroke="${color}" stroke-width="0.6" opacity="0">
        <animate attributeName="r" values="${AV_R};${AV_R+5}" dur="1.6s" repeatCount="indefinite" calcMode="ease-in"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite" calcMode="ease-in"/>
      </circle>
      <circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${AV_R}" fill="none" stroke="${color}" stroke-width="0.5" opacity="0">
        <animate attributeName="r" values="${AV_R};${AV_R+5}" dur="1.6s" repeatCount="indefinite" calcMode="ease-in" begin="0.8s"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite" calcMode="ease-in" begin="0.8s"/>
      </circle>`;
    }

    avatarSvg += `<clipPath id="${clipId}"><circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${AV_R}"/></clipPath>`;
    if (p.avatar_url) {
      avatarSvg += `<image href="${p.avatar_url}" x="${(ax-AV_R).toFixed(1)}" y="${(ay-AV_R).toFixed(1)}" width="${AV_R*2}" height="${AV_R*2}" clip-path="url(#${clipId})" opacity="${opacity}" preserveAspectRatio="xMidYMid slice"/>`;
    } else {
      avatarSvg += `<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${AV_R}" fill="${color}33" opacity="${opacity}"/>`;
      avatarSvg += `<text x="${ax.toFixed(1)}" y="${ay.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${(AV_R*1.1).toFixed(1)}" font-weight="900" fill="${color}" opacity="${opacity}">${(p.name||'?')[0].toUpperCase()}</text>`;
    }
    // Border ring — thicker and brighter for active player
    avatarSvg += `<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${AV_R}" fill="none" stroke="${color}" stroke-width="${isActive ? 1.4 : 0.9}" opacity="${opacity}"/>`;

    // Scythe badge for killers — bottom-right of avatar
    if (isKiller[p.id] && !eliminated[p.id]) {
      const sx = parseFloat((ax + AV_R * 0.58).toFixed(1));
      const sy = parseFloat((ay + AV_R * 0.58).toFixed(1));
      const r = 2.8;
      // Dark circle background
      avatarSvg += `<circle cx="${sx}" cy="${sy}" r="${r}" fill="rgba(0,0,0,0.88)" stroke="#555" stroke-width="0.4"/>`;
      // Scythe: curved blade arc + straight handle
      // Handle: diagonal line from bottom-left to top-right of badge
      const hx1 = (sx - r*0.55).toFixed(1), hy1 = (sy + r*0.55).toFixed(1);
      const hx2 = (sx + r*0.55).toFixed(1), hy2 = (sy - r*0.55).toFixed(1);
      avatarSvg += `<line x1="${hx1}" y1="${hy1}" x2="${hx2}" y2="${hy2}" stroke="#8B4513" stroke-width="0.55" stroke-linecap="round"/>`;
      // Blade: arc curving from tip of handle outward
      const bx1 = (sx + r*0.55).toFixed(1), by1 = (sy - r*0.55).toFixed(1);
      const bx2 = (sx - r*0.1).toFixed(1),  by2 = (sy - r*0.7).toFixed(1);
      const bcx = (sx + r*0.8).toFixed(1),   bcy = (sy - r*0.8).toFixed(1);
      avatarSvg += `<path d="M${bx1},${by1} Q${bcx},${bcy} ${bx2},${by2}" stroke="#c0c0c0" stroke-width="0.7" fill="none" stroke-linecap="round"/>`;
    }
  });

  // Phase header info for assignment (used in board wrap, not a separate header bar)
  const maxRounds  = ds.max_rounds || 0;
  const currRound  = ds.current_round || 0;
  const multiplier = ds.hit_multiplier || 1;
  const multLabel  = multiplier === 3 ? '🔴 TRIPLE DAMAGE' : multiplier === 2 ? '🟡 DOUBLE DAMAGE' : '';
  const roundLabel = maxRounds > 0 ? `ROUND ${currRound} / ${maxRounds}` : '';
  const assignMsg  = phase === 'assignment'
    ? `🎯 ${assignQueue[0] ? (players.find(p=>p.id===assignQueue[0])?.name||'').toUpperCase() + ' — THROW WITH YOUR OFF HAND' : 'ALL ASSIGNED'}`
    : '';

  // Restore tv-layout visibility so mode badge shows in top-left
  if (tvLayout) tvLayout.style.visibility = 'visible';
  // Hide the tv-main border and sidebar that bleed through the overlay
  const tvMain = document.querySelector('.tv-main');
  if (tvMain) tvMain.style.borderRight = 'none';
  const tvSidebarEl = document.querySelector('.tv-sidebar');
  if (tvSidebarEl) tvSidebarEl.style.visibility = 'hidden';

  overlay.innerHTML = `
    ${assignMsg || roundLabel || multLabel ? `<div id="killerPhaseHeader">
      ${assignMsg   ? `<span style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--primary);text-transform:uppercase">${assignMsg}</span>` : ''}
      ${roundLabel  ? `<span style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--muted)">${roundLabel}</span>` : ''}
      ${multLabel   ? `<span style="font-size:14px;font-weight:900;letter-spacing:2px;padding:4px 12px;border-radius:6px;background:${multiplier===3?'rgba(220,38,38,0.25)':'rgba(234,179,8,0.2)'};color:${multiplier===3?'#f87171':'#fbbf24'}">${multLabel}</span>` : ''}
    </div>` : ''}
    <div style="display:flex;flex:1;min-height:0">
      <div id="killerBoardWrap" style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;min-width:0;padding:8px">
        <svg id="killerBoardSvg" viewBox="-25 -25 160 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
          <circle cx="${CX}" cy="${CY}" r="54" fill="#0a0a0a"/>
          ${segPaths}
          ${avatarSvg}
        </svg>
        <div style="position:absolute;bottom:16px;left:16px;width:380px;display:flex;flex-direction:column;gap:6px;pointer-events:none">
          <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:2px">LAST THROWS</div>
          <div id="killerDartFeed" style="display:flex;flex-direction:column;gap:4px"></div>
        </div>
      </div>
      <div id="killerSidebar" style="width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:20px;background:rgba(0,0,0,0.3);border-left:1px solid rgba(255,255,255,0.06);overflow-y:auto;box-sizing:border-box;align-items:stretch">
        ${players.map(p => {
          const isActive = p.id === currentPid;
          const isElim = eliminated[p.id];
          const pLives = lives[p.id] ?? 0;
          const killer = isKiller[p.id];
          const color = colorMap[p.id];
          const pips = Array.from({length: startLives}, (_, i) =>
            `<svg class="life-pip${i >= pLives ? ' lost' : ''}" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg" style="width:34px;height:34px"><path d="M10 16.5C10 16.5 1 11 1 5.5A4.5 4.5 0 0 1 10 3.8 4.5 4.5 0 0 1 19 5.5C19 11 10 16.5 10 16.5Z" fill="${color}"/></svg>`
          ).join('');
          const avatarEl = p.avatar_url
            ? `<img src="${p.avatar_url}" style="width:80px;height:80px;border-radius:50%;border:4px solid ${color};object-fit:cover;flex-shrink:0">`
            : `<div style="width:80px;height:80px;border-radius:50%;border:4px solid ${color};background:${color}22;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:${color};flex-shrink:0">${(p.name||'?')[0].toUpperCase()}</div>`;
          const badge = killer ? `<div style="margin:4px 0"><span class="killer-card-badge" style="font-size:11px;padding:3px 10px">KILLER</span></div>` : '';
          return `<div style="display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;border:2px solid ${isActive ? color : 'rgba(255,255,255,0.06)'};background:${isActive ? color+'15' : 'rgba(0,0,0,0.3)'};opacity:${isElim ? 0.25 : 1};box-sizing:border-box;width:100%">
            ${avatarEl}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:${color};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
              ${badge}
              <div class="lives-row" style="justify-content:flex-start;margin-top:8px;gap:6px">${pips}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  // Repopulate dart feed — overlay.innerHTML wipes it, so re-render from feedItems
  requestAnimationFrame(() => {
    const kf = document.getElementById('killerDartFeed');
    if (!kf || !feedItems.length) return;
    const dartColor = (d) => {
      if (d.bust)               return '#e63946';
      if (d.ring === 'miss')    return '#555e6b';
      if (d.ring === 'triple')  return '#008751';
      if (d.ring === 'double')  return '#4a9eff';
      if (d.ring === 'bullseye')return '#e63946';
      if (d.ring === 'bull')    return '#f5a623';
      return '#c8cdd4';
    };
    kf.innerHTML = feedItems.map(d => {
      const c = dartColor(d);
      const pc = playerColorOf(d.player_id);
      const label = d.bust ? 'BUST' : formatDartLabel(d);
      const scored = d.bust ? '' : (d.scored || '');
      return '<div style="display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,0.6);border-radius:6px;border-left:3px solid ' + c + '">'
        + '<span style="font-family:var(--font-display);font-size:22px;color:' + pc + ';text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + d.player_name + '</span>'
        + '<div style="min-width:44px;height:24px;border-radius:4px;border:1px solid ' + c + ';display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;color:' + c + ';padding:0 4px">' + label + '</div>'
        + '<span style="font-family:var(--font-display);font-size:24px;color:' + c + ';min-width:28px;text-align:right">' + scored + '</span>'
        + '</div>';
    }).join('');
  });

}

let _kickDownTimer = null;
function showKickDownFlash(playerName) {
  const existing = document.getElementById('kickDownFlash');
  if (existing) existing.remove();
  if (_kickDownTimer) clearTimeout(_kickDownTimer);
  const el = document.createElement('div');
  el.id = 'kickDownFlash';
  el.style.cssText = 'position:absolute;inset:0;z-index:95;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;transition:opacity 0.2s';
  el.innerHTML = `
    <div style="font-family:var(--font-display);font-size:80px;font-weight:900;color:#e63946;letter-spacing:6px;text-shadow:0 0 40px #e6394688;text-transform:uppercase;line-height:1">💥 KICK DOWN!</div>

  const frame = document.getElementById('tvGame') || document.body;
  frame.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => { el.style.opacity = '1'; }); });
  _kickDownTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

let _shanghaiPunTimer = null;
function showShanghaiPun(marks, subtitle) {
  const data = SHANGHAI_PUNS[marks];
  if (!data) return;
  const svg = LANDMARK_SVGS[marks] || '';

  const existing = document.getElementById('shanghaiPunOverlay');
  if (existing) existing.remove();
  if (_shanghaiPunTimer) clearTimeout(_shanghaiPunTimer);

  const el = document.createElement('div');
  el.id = 'shanghaiPunOverlay';
  el.style.cssText = `
    position:absolute; inset:0; z-index:95; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity 0.4s;
  `;
  el.innerHTML = `
    <div style="
      background:rgba(10,14,26,0.92); border:3px solid ${data.color};
      border-radius:24px; padding:32px 48px; text-align:center;
      box-shadow:0 0 60px ${data.color}66; backdrop-filter:blur(8px);
      display:flex; flex-direction:column; align-items:center; gap:16px;
      max-width:500px;
    ">
      ${subtitle ? `<div style="font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:2px;color:var(--primary);text-transform:uppercase;line-height:1">${subtitle}</div>` : ''}
      <div style="width:160px;height:160px;display:flex;align-items:center;justify-content:center">
        ${svg}
      </div>
      <div style="font-family:var(--font-display);font-size:52px;font-weight:900;letter-spacing:3px;color:${data.color};text-transform:uppercase;line-height:1">${data.pun}</div>
      <div style="font-family:var(--font-mono);font-size:16px;color:rgba(255,255,255,0.4);letter-spacing:3px">${data.real}</div>
      <div style="font-family:var(--font-mono);font-size:13px;color:${data.color};opacity:0.6;letter-spacing:2px">${marks} MARKS</div>
    </div>`;

  const frame = document.getElementById('tvGame') || document.body;
  frame.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => { el.style.opacity = '1'; }); });

  _shanghaiPunTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 400);
  }, 4000);
}

function renderLimboTV(ds, gameState) {
  const grid = document.getElementById('tvPlayersGrid');
  if (grid) grid.style.display = 'none';
  const boardContainer = document.querySelector('.board-container');
  if (boardContainer) boardContainer.style.display = 'none';
  const sidebar = document.querySelector('.tv-sidebar');
  if (sidebar) sidebar.style.display = 'none';
  const tvLayout = document.querySelector('.tv-layout');
  if (tvLayout) tvLayout.style.visibility = 'visible';
  const tvMain = document.querySelector('.tv-main');
  if (tvMain) tvMain.style.borderRight = 'none';

  let overlay = document.getElementById('limboOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'limboOverlay';
    overlay.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;z-index:10;background:var(--bg);overflow:hidden';
    document.getElementById('tvGame').appendChild(overlay);
  }

  const players    = gameState.players || [];
  const lives      = ds.lives || {};
  const eliminated = ds.eliminated || {};
  const startLives = ds.starting_lives || 3;
  const currentBar = ds.current_bar ?? 60;
  const turnStartBar = ds.turn_start_bar ?? currentBar;
  const startingBar = ds.starting_bar ?? 60;
  // Use cached display bar (frozen at turn start) so number doesn't change mid-turn
  const displayBar = _limboBarDisplay ?? currentBar;
  const turnTotals = ds.turn_totals || {};
  const currentPid = gameState.current_player_id;
  const darts      = gameState.darts_this_turn || [];
  const currentPlayer = players.find(p => p.id === currentPid);
  const currentColor  = currentPlayer ? playerColorOf(currentPid) : 'var(--primary)';

  // Running total this turn for active player
  // Running total — compute from darts_this_turn, miss counts as 25 in limbo
  const runningTotal = darts
    .filter(d => d.player_id === currentPid)
    .reduce((s, d) => s + (d.ring === 'miss' ? 25 : (d.scored || 0)), 0);
  const hitBar = runningTotal >= turnStartBar;

  // Bar chart fill height as % of bar space (0–currentBar maps to 0–100%)
  const fillPct = Math.min(100, (runningTotal / turnStartBar) * 100);

  // Sidebar: player cards with colored hearts
  const sidebarCards = players.map(p => {
    const color = playerColorOf(p.id);
    const pLives = lives[p.id] ?? 0;
    const isElim = eliminated[p.id];
    const isActive = p.id === currentPid;
    const hearts = Array.from({length: startLives}, (_, i) => {
      const lost = i >= pLives;
      return `<svg viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;${lost?'opacity:0.15':''}">
        <path d="M10 16.5C10 16.5 1 11 1 5.5A4.5 4.5 0 0 1 10 3.8 4.5 4.5 0 0 1 19 5.5C19 11 10 16.5 10 16.5Z" fill="${color}"/>
      </svg>`;
    }).join('');
    const avatarEl = p.avatar_url
      ? `<img src="${p.avatar_url}" style="width:64px;height:64px;border-radius:50%;border:3px solid ${isElim?'#333':color};object-fit:cover;${isElim?'opacity:0.3':''}">`
      : `<div style="width:64px;height:64px;border-radius:50%;border:3px solid ${isElim?'#333':color};background:${color}22;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:${color};${isElim?'opacity:0.3':''}">${(p.name||'?')[0].toUpperCase()}</div>`;
    return `<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:2px solid ${isActive?color:'rgba(255,255,255,0.06)'};background:${isActive?color+'18':'rgba(0,0,0,0.3)'};box-sizing:border-box">
      ${avatarEl}
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:2px;color:${isElim?'#444':color};text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
        <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">${hearts}</div>
      </div>
    </div>`;
  }).join('');

  // Dart slots for active player
  const dartSlots = [0,1,2].map(i =>
    `<div style="width:28px;height:10px;border-radius:3px;background:${i < darts.length ? currentColor : 'rgba(255,255,255,0.1)'}"></div>`
  ).join('');

  // Dart feed — last 5
  const dartFeedHtml = feedItems.slice(0,5).map(d => {
    const c = d.ring==='triple'?'#008751':d.ring==='double'?'#4a9eff':d.bust?'#e63946':'#c8cdd4';
    const pc = playerColorOf(d.player_id);
    const label = d.bust ? 'BUST' : formatDartLabel(d);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,0.4);border-radius:6px;border-left:3px solid ${c}">
      <span style="font-family:var(--font-display);font-size:22px;color:${pc};text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.player_name}</span>

        return `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid ${place===1?color:'rgba(255,255,255,0.06)'};background:${place===1?color+'18':'rgba(0,0,0,0.3)'}">

      <div style="width:400px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:24px 20px;background:rgba(0,0,0,0.3);border-left:1px solid rgba(255,255,255,0.06);overflow-y:auto;box-sizing:border-box;justify-content:center">

  requestAnimationFrame(() => {

  });
}

// ── Avatar image cache ────────────────────────────────────────────────────────
const _slAvatarCache = {};
function slLoadAvatar(url) {
  if (_slAvatarCache[url]) return _slAvatarCache[url];
  const img = new Image();
  img.src = url;
  img.onload = () => {
    _slAvatarCache[url] = img;
    // Redraw when avatar loads
    const canvas = document.getElementById('slBoardCanvas');
    if (canvas && canvas._slLastDraw) canvas._slLastDraw();
  };
  _slAvatarCache[url] = img; // placeholder (may not be loaded yet)
  return img;
}

// ── Cached background canvas ──────────────────────────────────────────────────
let _slBgCanvas = null;
let _slBgKey = '';

function slGetBackground(W, H, cellW, cellH, margin) {
  const key = `${W}x${H}`;
  if (_slBgCanvas && _slBgKey === key) return _slBgCanvas;
  _slBgKey = key;
  _slBgCanvas = document.createElement('canvas');
  _slBgCanvas.width = W;
  _slBgCanvas.height = H;
  const ctx = _slBgCanvas.getContext('2d');
  const layout = slBuildLayout();

  // Board background
  ctx.fillStyle = '#111827';
  roundRect(ctx, 0, 0, W, H, 12);
  ctx.fill();

  // Pre-calculate the named-square font size using STAIRWAY as the reference word,
  // so all named squares use the same font size
  const _namedZoneW = (2 * cellW - 2) / 2 * 0.85; // 85% of half a double-wide cell
  let _namedFs = 48;
  ctx.font = `900 ${_namedFs}px sans-serif`;
  while (_namedFs > 8 && ctx.measureText('STAIRWAY').width > _namedZoneW) {
    _namedFs--;
    ctx.font = `900 ${_namedFs}px sans-serif`;
  }

  // ── Grid squares ──
  for (let sq = 0; sq <= 65; sq++) {
    const cell = layout[sq];
    if (!cell) continue;
    const x = margin + cell.gridCol * cellW;
    const y = margin + cell.gridRow * cellH;
    const w = cell.colSpan * cellW - 2;
    const h = cell.rowSpan * cellH - 2;

    const isLadderBase = sq in SL_LADDERS;
    const isSnakeHead  = sq in SL_SNAKES;
    const isLadderTop  = Object.values(SL_LADDERS).includes(sq);
    const isSnakeTail  = Object.values(SL_SNAKES).includes(sq);
    const isStart  = sq === 0;
    const isFinish = sq === 65;
    const isSpecialSnake = SL_SNAKE_NAMES[sq] !== undefined;
    const isSpecialLadder = SL_LADDER_NAMES[sq] !== undefined;

    // Cell fill
    let fill;
    if (isStart)       fill = '#1e3a5f';
    else if (isFinish) fill = '#2d1f00';
    else if (isSpecialSnake) fill = '#2d0808';
    else if (isSpecialLadder) fill = '#0d2a10';
    else if (isLadderBase || isLadderTop) fill = '#0f2414';
    else if (isSnakeHead  || isSnakeTail) fill = '#1f0c0c';
    else fill = ((cell.gridRow + cell.gridCol) % 2 === 0) ? '#1a2744' : '#1f3054';

    ctx.fillStyle = fill;
    roundRect(ctx, x+1, y+1, w, h, 7);
    ctx.fill();

    // Cell border
    ctx.strokeStyle = isSpecialSnake ? '#ef4444' : isSpecialLadder ? '#22c55e' :
                      isStart ? '#3b82f6' : isFinish ? '#f59e0b' :
                      isLadderBase ? '#166534' : isSnakeHead ? '#7f1d1d' : '#263a52';
    ctx.lineWidth = (isSpecialSnake || isSpecialLadder || isStart || isFinish) ? 2.5 : 1;
    roundRect(ctx, x+1, y+1, w, h, 7);
    ctx.stroke();

    // Square number (top-left, padded)
    if (!isStart && !isFinish) {
      const nfs = Math.max(14, Math.min(24, cellW * 0.33));
      ctx.fillStyle = '#6a8aaa';
      ctx.font = `bold ${nfs}px monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(sq, x + cellW * 0.08, y + nfs + cellH * 0.06);
    }

    // START label — no emoji, just text
    if (isStart) {
      ctx.fillStyle = '#60a5fa';
      ctx.font = `bold ${Math.max(12, cellW * 0.22)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('START', x + w/2, y + h/2);
      ctx.textBaseline = 'alphabetic';
    }

    // WINNER label — trophy up, text down, no overlap
    if (isFinish) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = `${Math.max(22, cellH * 0.38)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏆', x + w/2, y + h * 0.35);
      ctx.font = `bold ${Math.max(10, cellW * 0.16)}px sans-serif`;
      ctx.fillText('WINNER', x + w/2, y + h * 0.75);
      ctx.textBaseline = 'alphabetic';
    }

    // Named snake/ladder labels — centered in 85% of the correct half, auto-sized to fit
    if (isSpecialSnake || isSpecialLadder) {
      ctx.fillStyle = isSpecialSnake ? '#fca5a5' : '#86efac';

      // Which half: 13+42 → right half, 52+62 → left half
      const useRightHalf = (sq === 13 || sq === 42);
      const halfX = useRightHalf ? x + w/2 : x;
      const halfW = w / 2;

      // Padded zone: 85% of the half
      const padX = halfW * 0.075;
      const padY = h * 0.075;
      const zoneX = halfX + padX;
      const zoneW = halfW - padX * 2;
      const zoneY = y + padY;
      const zoneH = h - padY * 2;
      const centerX = zoneX + zoneW / 2;

      const name = (SL_SNAKE_NAMES[sq] || SL_LADDER_NAMES[sq] || '').toUpperCase();
      const words = name.split(' ');

      // Size font — use shared size calculated from STAIRWAY reference
      const fs = _namedFs;
      ctx.font = `900 ${fs}px sans-serif`;

      // Wrap at that size
      const lines = [];
      let cur = '';
      for (const word of words) {
        const test = cur ? cur + ' ' + word : word;
        if (ctx.measureText(test).width <= zoneW || !cur) {
          cur = test;
        } else {
          lines.push(cur);
          cur = word;
        }
      }
      if (cur) lines.push(cur);

      const lineH = fs * 1.2;
      const totalH = lines.length * lineH;
      const startY = zoneY + (zoneH - totalH) / 2 + fs * 0.85;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      lines.forEach((line, i) => {
        ctx.fillText(line, centerX, startY + i * lineH);
      });
    }
  }

  // ── Ladders ──
  for (const [from, to] of Object.entries(SL_LADDERS)) {
    const a = slSquareCenter(parseInt(from), cellW, cellH, margin);
    const b = slSquareCenter(parseInt(to), cellW, cellH, margin);
    if (!a || !b) continue;
    drawLadder(ctx, a, b);
  }

  // ── Snakes — drawn with custom cubic bezier control points per snake ──
  const snakeColors = {
    16: { body:'#eab308', shine:'#fef08a', head:'#a16207' },
    30: { body:'#9333ea', shine:'#d8b4fe', head:'#7e22ce' },
    42: { body:'#16a34a', shine:'#86efac', head:'#15803d' },
    52: { body:'#f97316', shine:'#fed7aa', head:'#ea580c' },
    60: { body:'#0891b2', shine:'#a5f3fc', head:'#0e7490' },
    62: { body:'#dc2626', shine:'#fca5a5', head:'#991b1b' },
  };

  // Helper: pixel coords from grid col/row (cell center)
  const gc = (col, row) => ({
    x: margin + col * cellW + cellW / 2,
    y: margin + row * cellH + cellH / 2,
  });

  const snakePaths = Object.fromEntries(
    Object.entries(SL_SNAKE_CP).map(([k, v]) => [k, {
      cp1: gc(v.cp1[0], v.cp1[1]),
      cp2: gc(v.cp2[0], v.cp2[1]),
    }])
  );

  for (const [from, to] of Object.entries(SL_SNAKES)) {
    const fromN = parseInt(from);
    const a = slSquareCenter(fromN, cellW, cellH, margin);
    const b = slSquareCenter(parseInt(to), cellW, cellH, margin);
    if (!a || !b) continue;
    const colors = snakeColors[fromN] || { body:'#dc2626', shine:'#fca5a5', head:'#991b1b' };
    const path = snakePaths[fromN];
    drawSnake(ctx, a, b, colors, path && path.cp1, path && path.cp2);
  }

  return _slBgCanvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawLadder(ctx, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx*dx + dy*dy);
  const nx = -dy/len, ny = dx/len;
  const rail = 6;
  const shadow = 2;

  // Shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a.x+nx*rail+shadow, a.y+ny*rail+shadow); ctx.lineTo(b.x+nx*rail+shadow, b.y+ny*rail+shadow); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x-nx*rail+shadow, a.y-ny*rail+shadow); ctx.lineTo(b.x-nx*rail+shadow, b.y-ny*rail+shadow); ctx.stroke();

  // Rails - dark wood
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(a.x+nx*rail, a.y+ny*rail); ctx.lineTo(b.x+nx*rail, b.y+ny*rail); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x-nx*rail, a.y-ny*rail); ctx.lineTo(b.x-nx*rail, b.y-ny*rail); ctx.stroke();

  // Rails - highlight
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(a.x+nx*rail, a.y+ny*rail); ctx.lineTo(b.x+nx*rail, b.y+ny*rail); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x-nx*rail, a.y-ny*rail); ctx.lineTo(b.x-nx*rail, b.y-ny*rail); ctx.stroke();

  // Rungs
  const rungs = Math.max(4, Math.floor(len / 22));
  for (let i = 1; i < rungs; i++) {
    const t = i / rungs;
    const rx = a.x + dx*t, ry = a.y + dy*t;
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx+nx*(rail+1)+1, ry+ny*(rail+1)+1); ctx.lineTo(rx-nx*(rail+1)+1, ry-ny*(rail+1)+1); ctx.stroke();
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(rx+nx*(rail+1), ry+ny*(rail+1)); ctx.lineTo(rx-nx*(rail+1), ry-ny*(rail+1)); ctx.stroke();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(rx+nx*(rail+1), ry+ny*(rail+1)); ctx.lineTo(rx+nx*2, ry+ny*2); ctx.stroke();
  }
}

function drawSnake(ctx, a, b, colors, cp1, cp2) {
  // Cubic bezier body — cp1/cp2 are custom control points per snake for deliberate routing
  const hasCp = cp1 && cp2;
  // Fallback auto control points if none provided
  const fmx = (a.x+b.x)/2 + (b.y-a.y)*0.4;
  const fmy = (a.y+b.y)/2 - (b.x-a.x)*0.4;
  const fc1 = hasCp ? cp1 : {x: a.x+(fmx-a.x)*0.6, y: a.y+(fmy-a.y)*0.6};
  const fc2 = hasCp ? cp2 : {x: b.x+(fmx-b.x)*0.6, y: b.y+(fmy-b.y)*0.6};

  function bezPath(ox, oy) {
    ctx.beginPath();
    ctx.moveTo(a.x+ox, a.y+oy);
    ctx.bezierCurveTo(fc1.x+ox, fc1.y+oy, fc2.x+ox, fc2.y+oy, b.x+ox, b.y+oy);
  }

  // Shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  bezPath(2, 2); ctx.stroke();

  // Body
  ctx.strokeStyle = colors.body; ctx.lineWidth = 15;
  bezPath(0, 0); ctx.stroke();

  // Shine
  ctx.strokeStyle = colors.shine; ctx.lineWidth = 5; ctx.globalAlpha = 0.4;
  bezPath(0, 0); ctx.stroke();
  ctx.globalAlpha = 1;

  // Scale dots along cubic bezier
  ctx.fillStyle = colors.head;
  const steps = 10;
  for (let i = 1; i < steps; i++) {
    const t = i / steps, mt = 1-t;
    const px = mt*mt*mt*a.x + 3*mt*mt*t*fc1.x + 3*mt*t*t*fc2.x + t*t*t*b.x;
    const py = mt*mt*mt*a.y + 3*mt*mt*t*fc1.y + 3*mt*t*t*fc2.y + t*t*t*b.y;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Tail
  ctx.fillStyle = colors.body;
  ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();

  // Head direction from a toward fc1
  const hdx = a.x - fc1.x, hdy = a.y - fc1.y;
  const hdl = Math.sqrt(hdx*hdx+hdy*hdy) || 1;
  const fx = hdx/hdl, fy = hdy/hdl;

  ctx.fillStyle = colors.head;
  ctx.beginPath(); ctx.arc(a.x, a.y, 14, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = colors.body;
  ctx.beginPath(); ctx.arc(a.x, a.y, 11, 0, Math.PI*2); ctx.fill();

  // Eyes
  const ex1x = a.x+fx*5-fy*5, ex1y = a.y+fy*5+fx*5;
  const ex2x = a.x+fx*5+fy*5, ex2y = a.y+fy*5-fx*5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex1x, ex1y, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2x, ex2y, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(ex1x+0.5, ex1y+0.5, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2x+0.5, ex2y+0.5, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = colors.body;
  ctx.beginPath(); ctx.arc(ex1x+0.5, ex1y+0.5, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2x+0.5, ex2y+0.5, 1, 0, Math.PI*2); ctx.fill();

  // Tongue
  ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const tx = a.x+fx*16, ty = a.y+fy*16;
  ctx.beginPath(); ctx.moveTo(a.x+fx*13, a.y+fy*13); ctx.lineTo(tx-fy*4, ty+fx*4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x+fx*13, a.y+fy*13); ctx.lineTo(tx+fy*4, ty-fx*4); ctx.stroke();
}

function slDrawDiscs(ctx, cellW, cellH, margin, players, positions, gameState, pulseT) {
  const layout = slBuildLayout();
  const posBuckets = {};
  for (const p of players) {
    const pos = positions[p.id] !== undefined ? positions[p.id] : 0;
    if (!posBuckets[pos]) posBuckets[pos] = [];
    posBuckets[pos].push(p);
  }

  for (const [posStr, group] of Object.entries(posBuckets)) {
    const pos = parseInt(posStr);
    const center = slSquareCenter(pos, cellW, cellH, margin);
    if (!center) continue;

    const n = group.length;
    const r = Math.min(cellW, cellH) * 0.18;
    group.forEach((p, i) => {
      const color = playerColorOf(p.id);
      const isActive = p.id === gameState.current_player_id;
      const pulse = isActive ? 1 + Math.sin(pulseT) * 0.12 : 1;
      const dr = (isActive ? r * 1.4 : r) * pulse;
      const angle = (2 * Math.PI * i) / n - Math.PI/2;
      const offset = n > 1 ? r * 0.7 : 0;
      const px = center.x + Math.cos(angle) * offset;
      const py = center.y + Math.sin(angle) * offset;

      // Outer pulse ring for active player
      if (isActive) {
        const ringR = dr + 8 + Math.sin(pulseT) * 6;
        const ringAlpha = 0.5 + Math.sin(pulseT) * 0.3;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.globalAlpha = ringAlpha;
        ctx.beginPath(); ctx.arc(px, py, ringR, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Avatar or colored disc
      const avatarImg = p.avatar_url ? _slAvatarCache[p.avatar_url] : null;
      if (avatarImg && avatarImg.complete && avatarImg.naturalWidth) {
        ctx.save();
        ctx.beginPath(); ctx.arc(px, py, dr, 0, Math.PI*2); ctx.clip();
        ctx.drawImage(avatarImg, px-dr, py-dr, dr*2, dr*2);
        ctx.restore();
        // Border
        ctx.strokeStyle = color;
        ctx.lineWidth = isActive ? 3 : 2;
        ctx.beginPath(); ctx.arc(px, py, dr, 0, Math.PI*2); ctx.stroke();
      } else {
        // Solid disc
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(px, py, dr, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(px, py, dr, 0, Math.PI*2); ctx.stroke();
        // Initial
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${dr * 0.85}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((p.name||'?')[0].toUpperCase(), px, py);
        ctx.textBaseline = 'alphabetic';
      }

      // Preload avatar
      if (p.avatar_url && !_slAvatarCache[p.avatar_url]) slLoadAvatar(p.avatar_url);
    });
  }
}

// Animation loop state
let _slPulseRaf = null;
let _slPulseT = 0;

function slDrawBoard(canvas, W, H, players, positions, gameState) {
  const margin = 8;
  const cellW = (W - margin * 2) / SL_GRID_COLS;
  const cellH = (H - margin * 2) / SL_GRID_ROWS;

  // Preload avatars
  (players || []).forEach(p => { if (p.avatar_url) slLoadAvatar(p.avatar_url); });

  // Don't touch the pulse loop if a hop/slide animation is currently running
  if (_slAnimating) return;

  // Cancel any existing pulse loop before starting a new one
  if (_slPulseRaf) { cancelAnimationFrame(_slPulseRaf); _slPulseRaf = null; }

  const bg = slGetBackground(W, H, cellW, cellH, margin);
  const ctx = canvas.getContext('2d');

  // Store last draw params for avatar-load redraw
  canvas._slLastDraw = () => slDrawBoard(canvas, W, H, players, positions, gameState);

  function drawFrame() {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0);
    slDrawDiscs(ctx, cellW, cellH, margin, players, positions, gameState, _slPulseT);
  }

  // Check if any active players — if so, run animation loop
  const hasActive = (players || []).some(p => p.id === gameState.current_player_id);
  if (hasActive) {
    function loop() {
      _slPulseT += 0.04;
      drawFrame();
      _slPulseRaf = requestAnimationFrame(loop);
    }
    loop();
  } else {
    drawFrame();
  }
}

// ── S&L Animation State ───────────────────────────────────────────────────────
let _slAnimPositions = {};   // pid → square currently shown on board (animation cursor)
let _slAnimating = false;    // block re-renders while animating

// Called by handleEvent for dart_scored in S&L mode.
// Returns true if it took over rendering (caller should skip renderAll).
function slHandleDartEvent(newState, onDone) {
  if (!newState || newState.mode !== 'snakes_ladders') return false;
  const ds = newState.mode_display || {};
  const events = ds.events || [];
  const ev = events[0];

  // Flash die face and update mini dartboard ring highlight
  const dieFace = document.getElementById('slDieFace');
  if (dieFace && ev && ev.die >= 1 && ev.die <= 6) {
    dieFace.textContent = SL_DIE_FACES[ev.die];
    dieFace.classList.add('flash');
    setTimeout(() => dieFace && dieFace.classList.remove('flash'), 800);
  }
  // Redraw mini board immediately so ring highlight updates before hop animation
  drawBoard('slMiniBoard', []);

  if (!ev || ev.die === 0) {
    console.log('[SL] no event or die=0, ev:', ev);
    onDone(); return true;
  }

  const pid = ev.pid;
  const fromSq = ev.from;
  const landSq  = ev.slide_from || ev.to;
  const finalSq = ev.to;


  // Snapshot state NOW before any turn_changed event can mutate it
  const frozenState = JSON.parse(JSON.stringify(newState));
  const frozenPositions = Object.assign({}, ds.positions || {});

  // The backend advances the turn BEFORE returning dart_scored, so frozenState.current_player_id
  // is already the NEXT player. Override it to be the thrower so animation draws them as active.
  frozenState.current_player_id = ev.pid;

  // Seed anim positions: other players from current state, moving player from event.from
  (frozenState.players || []).forEach(p => {
    if (p.id === ev.pid) {
      _slAnimPositions[p.id] = ev.from;  // start animation from their pre-dart position
    } else if (_slAnimPositions[p.id] === undefined) {
      _slAnimPositions[p.id] = frozenPositions[p.id] || 0;
    }
  });

  _slAnimating = true;
  _slAnimPositions[pid] = fromSq;

  // Stop the pulse loop — animation owns the canvas exclusively
  if (_slPulseRaf) { cancelAnimationFrame(_slPulseRaf); _slPulseRaf = null; }

  // Build hop sequence: one square at a time from fromSq → landSq
  const steps = [];
  const dir = landSq >= fromSq ? 1 : -1;
  for (let sq = fromSq + dir; dir > 0 ? sq <= landSq : sq >= landSq; sq += dir) {
    steps.push(sq);
  }

  const HOP_MS = 280;    // ms per square hop
  const PAUSE_MS = 250;  // pause before snake/ladder slide
  const SLIDE_MS = 900;  // total slide duration along snake/ladder

  function redrawBoard() {
    const canvas = document.getElementById('slBoardCanvas');
    if (!canvas) { console.log('[SL] redrawBoard: no canvas!'); return; }
    const W = canvas.width || canvas.parentElement.clientWidth || 800;
    const H = canvas.height || canvas.parentElement.clientHeight || 720;
    const margin = 8;
    const cellW = (W - margin * 2) / SL_GRID_COLS;
    const cellH = (H - margin * 2) / SL_GRID_ROWS;
    const animPositions = Object.assign({}, frozenPositions, _slAnimPositions);
    const ctx = canvas.getContext('2d');
    const bg = slGetBackground(W, H, cellW, cellH, margin);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0);
    slDrawDiscs(ctx, cellW, cellH, margin, frozenState.players || [], animPositions, frozenState, _slPulseT);
    _slPulseT += 0.05;
  }

  // Step 1: hop square by square using rAF-based timing
  function hopNext(idx, lastTime) {
    if (idx >= steps.length) {
      console.log('[SL] hops done, at landSq', landSq, 'slide_type:', ev.slide_type);
      _slAnimPositions[pid] = landSq;
      redrawBoard();
      if (ev.slide_type) {
        // Show notification as slide begins
        const player = (frozenState.players || []).find(p => p.id === pid);
        const pname = player ? player.name.toUpperCase() : '';
        if (ev.slide_type === 'snake') {
          showSlNotification(`🐍 TUNNEL SNAKES RULE — AND WE RULE`, pname, '#e63946');
          showAnnouncement(`🐍 ${pname} — WE'RE THE TUNNEL SNAKES!`, 2800);
          try {
            playAudio('/uploads/tunnel-snakes-rule.mp3', 0, 2.0);
          } catch(e) { console.warn('Audio play failed:', e); }
        } else if (ev.slide_type === 'ladder') {
          showSlNotification(`🪜 YOU RULE!`, pname, '#f5a623');
          showAnnouncement(`🪜 ${pname} CLIMBS A LADDER — YOU RULE!`, 2800);
          try {
            playAudio('/uploads/tunnel-snakes-rule.mp3', 5.5);
          } catch(e) { console.warn('Audio play failed:', e); }
        }
        setTimeout(() => slideAlongPath(), PAUSE_MS);
      } else {
        finishAnim();
      }
      return;
    }
    const now = performance.now();
    if (lastTime === undefined || now - lastTime >= HOP_MS) {
      _slAnimPositions[pid] = steps[idx];
      redrawBoard();
      requestAnimationFrame(() => hopNext(idx + 1, now));
    } else {
      requestAnimationFrame(() => hopNext(idx, lastTime));
    }
  }

  // Step 2: slide along snake/ladder path
  function slideAlongPath() {
    const canvas = document.getElementById('slBoardCanvas');
    if (!canvas) { finishAnim(); return; }
    const W = canvas.width || 800;
    const H = canvas.height || 720;
    const margin = 8;
    const cellW = (W - margin * 2) / SL_GRID_COLS;
    const cellH = (H - margin * 2) / SL_GRID_ROWS;

    const startCenter = slSquareCenter(landSq, cellW, cellH, margin);
    const endCenter   = slSquareCenter(finalSq, cellW, cellH, margin);
    if (!startCenter || !endCenter) { finishAnim(); return; }

    const color = playerColorOf(pid);
    const player = (frozenState.players || []).find(p => p.id === pid);
    const discR = Math.min(cellW, cellH) * 0.18 * 1.4;
    const avatarImg = player && player.avatar_url ? _slAvatarCache[player.avatar_url] : null;
    const ctx = canvas.getContext('2d');
    const bg = slGetBackground(W, H, cellW, cellH, margin);

    const startTime = performance.now();

    // For snakes, follow the actual bezier path. For ladders, straight line is fine.
    const snakeCp = ev.slide_type === 'snake' ? SL_SNAKE_CP[landSq] : null;
    let cp1px = null, cp2px = null;
    if (snakeCp) {
      // Convert fractional grid coords to pixels
      const gcPx = (col, row) => ({
        x: margin + col * cellW + cellW / 2,
        y: margin + row * cellH + cellH / 2,
      });
      cp1px = gcPx(snakeCp.cp1[0], snakeCp.cp1[1]);
      cp2px = gcPx(snakeCp.cp2[0], snakeCp.cp2[1]);
    }

    function cubicBezier(t, p0, p1, p2, p3) {
      const mt = 1 - t;
      return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
    }

    function animFrame(now) {
      const t = Math.min((now - startTime) / SLIDE_MS, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

      let cx, cy;
      if (snakeCp && cp1px && cp2px) {
        // Follow the snake's bezier path exactly
        cx = cubicBezier(ease, startCenter.x, cp1px.x, cp2px.x, endCenter.x);
        cy = cubicBezier(ease, startCenter.y, cp1px.y, cp2px.y, endCenter.y);
      } else {
        // Ladder: straight line
        cx = startCenter.x + (endCenter.x - startCenter.x) * ease;
        cy = startCenter.y + (endCenter.y - startCenter.y) * ease;
      }

      // Set anim position to interpolated for other discs to render correctly
      _slAnimPositions[pid] = landSq; // keep at landSq during slide

      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bg, 0, 0);

      // Draw all other discs at their positions
      const othersPositions = Object.assign({}, frozenPositions, _slAnimPositions);
      const othersPlayers = (frozenState.players || []).filter(p => p.id !== pid);
      slDrawDiscs(ctx, cellW, cellH, margin, othersPlayers, othersPositions, frozenState, _slPulseT);

      // Draw sliding disc manually at interpolated position
      if (avatarImg && avatarImg.complete && avatarImg.naturalWidth) {
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, discR, 0, Math.PI*2); ctx.clip();
        ctx.drawImage(avatarImg, cx-discR, cy-discR, discR*2, discR*2);
        ctx.restore();
        ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, discR, 0, Math.PI*2); ctx.stroke();
      } else {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(cx, cy, discR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${discR*0.85}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((player?.name||'?')[0].toUpperCase(), cx, cy);
        ctx.textBaseline = 'alphabetic';
      }
      // Pulse ring
      ctx.strokeStyle = color; ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.6 + Math.sin(_slPulseT)*0.3;
      ctx.beginPath(); ctx.arc(cx, cy, discR+6, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
      _slPulseT += 0.04;

      if (t < 1) {
        requestAnimationFrame(animFrame);
      } else {
        _slAnimPositions[pid] = finalSq;
        finishAnim();
      }
    }
    requestAnimationFrame(animFrame);
  }

  function finishAnim() {
    _slAnimPositions[pid] = finalSq;
    _slAnimating = false;
    if (_slPulseRaf) { cancelAnimationFrame(_slPulseRaf); _slPulseRaf = null; }
    onDone();
  }

  hopNext(0, undefined);
  return true;
}

function renderCricketTV(ds) {
  const grid = document.getElementById('tvPlayersGrid');
  const numbers = ds.cricket_numbers || [20,19,18,17,16,15,25];
  const marks = ds.cricket_marks || {};
  const globally_closed = ds.globally_closed || [];
  const teams = ds.teams;
  const teamColors = ['#2862A5','#5C2D91','#00b4a0','#e63946','#f5a623','#2dc653','#e87b1e','#c975d4','#00b8d9','#ff6b9d','#7cb518','#ff9a3c'];

  let entities;
  if (teams && teams.length) {
    entities = teams.map((t, i) => ({
      id: t.team_id,
      label: t.name || `Team ${i+1}`,
      marks: t.marks,
      score: t.score,
      color: t.color || teamColors[i % teamColors.length],
    }));
  } else {
    entities = state.players.map((p, i) => ({
      id: p.id,
      label: p.name,
      marks: marks[p.id] || {},
      score: state.player_scores[p.id] || 0,
      color: playerColorOf(p.id),
    }));
  }

  const isActive = (eid) => {
    if (teams && teams.length) {
      const team = teams.find(t => t.team_id === eid);
      return team && team.player_ids.includes(state.current_player_id);
    }
    return eid === state.current_player_id;
  };

  // Always interleave: E | N | E | N | E | N | E
  // Main area ≈ 1500px, number cols are 60px each, 8px column-gap
  // For n entities there are (n-1) number cols
  const n = entities.length;
  const NUM_COL_W = 44;
  const GAP = 4;
  const MAIN_W = 1436;
  const totalNumW = (n - 1) * (NUM_COL_W + GAP * 2);
  const totalGapE = n * GAP * 2;
  const colPx = Math.max(80, Math.min(320, Math.floor((MAIN_W - totalNumW - totalGapE - 16) / n)));
  const COL_WIDTH = `${colPx}px`;

  // Scale UI elements to column width
  const barW = Math.max(16, Math.min(72, Math.floor((colPx - 32) / 3)));
  const barH = Math.max(16, Math.min(34, Math.floor(barW * 0.48)));
  const nameFontSize = Math.max(14, Math.min(40, Math.floor(colPx * 0.18)));
  const scoreFontSize = Math.max(28, Math.min(72, Math.floor(colPx * 0.32)));
  const numFontSize = Math.max(14, Math.min(28, Math.floor(colPx * 0.12)));

  const gridRows = `auto ${numbers.map(()=>`${barH+18}px`).join(' ')} auto`;

  const medalColors = { 'medal-gold': '#f5a623', 'medal-silver': '#c0c0c0', 'medal-bronze': '#cd7f32' };
  const entityType = (teams && teams.length) ? 'team' : 'player';

  const markBarsHtml = (m, color) => {
    const count = parseInt(m || 0);
    return [0,1,2].map(i =>
      `<div class="mark-bar${i<count?' lit':''}" style="width:${barW}px;height:${barH}px;border-radius:3px;${i<count?`background:${color};box-shadow:0 0 6px ${color}55`:''}"></div>`
    ).join('');
  };

  const entityColHtml = (e) => {
    const active = isActive(e.id);
    const medalCls = state.game_over ? getMedalClass(e.id, entityType) : '';
    const medalColor = medalColors[medalCls];
    const border = medalColor
      ? `border:2px solid ${medalColor};background:${medalColor}18;box-shadow:0 0 16px ${medalColor}44`
      : active
        ? `border:2px solid ${e.color};background:${e.color}11`
        : `border:2px solid transparent`;
    const rows = numbers.map(n => {
      const isClosed = globally_closed.includes(n);
      const m = parseInt((e.marks && e.marks[String(n)]) || 0);
      return `<div style="display:flex;align-items:center;justify-content:center;gap:2px;opacity:${isClosed?0.2:1}">
        <div class="mark-bars" style="display:flex;gap:2px">${markBarsHtml(m, e.color)}</div>
      </div>`;
    }).join('');
    return `<div style="width:${COL_WIDTH};min-width:${COL_WIDTH};max-width:${COL_WIDTH};box-sizing:border-box;display:grid;grid-row:1/-1;grid-template-rows:subgrid;border-radius:10px;padding:6px 6px;${border}">
      <div style="font-family:var(--font-display);font-size:${nameFontSize}px;letter-spacing:1px;padding:4px 0 6px;color:${e.color};text-align:center;word-break:break-word;white-space:normal;line-height:1.1;align-self:center">${e.label}</div>
      ${rows}
      <div style="font-family:var(--font-display);font-size:${scoreFontSize}px;color:${e.color};padding-top:6px;text-align:center;align-self:center;line-height:1">${e.score}</div>
    </div>`;
  };

  const numberColHtml = () => {
    const rows = numbers.map(n => {
      const isClosed = globally_closed.includes(n);
      const label = n === 25 ? 'BULL' : n;
      return `<div style="display:flex;align-items:center;justify-content:center;opacity:${isClosed?0.2:1}">
        <span style="font-family:var(--font-display);font-size:${n===25?Math.max(11,numFontSize-4):numFontSize}px;color:${isClosed?'var(--muted)':'var(--white)'};text-decoration:${isClosed?'line-through':'none'}">${label}</span>
      </div>`;
    }).join('');
    return `<div style="width:${NUM_COL_W}px;display:grid;grid-row:1/-1;grid-template-rows:subgrid;padding:6px 2px">
      <div></div>
      ${rows}
      <div></div>
    </div>`;
  };

  // Always interleave number cols between every entity
  const templateCols = entities.map((_, i) => i < n - 1 ? `${COL_WIDTH} ${NUM_COL_W}px` : COL_WIDTH).join(' ');
  const cells = entities.map((e, i) =>
    entityColHtml(e) + (i < n - 1 ? numberColHtml() : '')
  ).join('');

  grid.style.display = 'block';
  grid.innerHTML = `<div style="display:grid;grid-template-columns:${templateCols};grid-template-rows:${gridRows};column-gap:${GAP}px;justify-content:center;overflow-x:auto;padding:8px">
    ${cells}
  </div>`;
}
